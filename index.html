<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIXDAY Team Opgaver</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", Arial, sans-serif;
}

body {
    background: #0f172a;
    color: white;
    min-height: 100vh;
}

.hidden {
    display: none !important;
}

.login-screen {
    min-height: 100vh;
    background: linear-gradient(135deg, #0f172a, #1d4ed8);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.login-box {
    background: #111827;
    width: 100%;
    max-width: 420px;
    padding: 30px;
    border-radius: 22px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
}

.login-box h1 {
    margin-bottom: 10px;
}

.login-box p {
    color: #cbd5e1;
    margin-bottom: 18px;
}

header {
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    padding: 42px 20px;
    text-align: center;
}

header h1 {
    font-size: 38px;
    margin-bottom: 8px;
}

header p {
    color: #dbeafe;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

.dashboard {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
    margin-bottom: 20px;
}

.stat {
    background: #111827;
    padding: 20px;
    border-radius: 18px;
    text-align: center;
}

.stat h2 {
    font-size: 34px;
    color: #60a5fa;
}

.form {
    background: #111827;
    padding: 22px;
    border-radius: 18px;
    margin-bottom: 24px;
}

label {
    display: block;
    margin: 12px 0 6px;
    color: #cbd5e1;
    font-size: 14px;
}

input,
textarea,
select {
    width: 100%;
    padding: 13px;
    background: #1f2937;
    color: white;
    border: 1px solid #334155;
    border-radius: 12px;
    outline: none;
    font-size: 15px;
}

textarea {
    min-height: 90px;
    resize: vertical;
}

button {
    background: #2563eb;
    color: white;
    border: none;
    padding: 12px 18px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 600;
    margin-top: 8px;
}

button:hover {
    background: #1d4ed8;
}

button.secondary {
    background: #374151;
}

button.danger {
    background: #dc2626;
}

button.success {
    background: #16a34a;
}

button:disabled {
    background: #64748b;
    cursor: not-allowed;
}

.top-actions {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 15px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
    gap: 20px;
}

.card {
    background: #111827;
    border-radius: 22px;
    overflow: hidden;
}

.card-img {
    width: 100%;
    height: 230px;
    object-fit: cover;
    background: #1f2937;
}

.no-img {
    height: 180px;
    background: linear-gradient(135deg, #1e293b, #334155);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #94a3b8;
    font-size: 46px;
}

.content {
    padding: 20px;
}

.task-title {
    font-size: 22px;
    margin-bottom: 8px;
}

.description {
    color: #cbd5e1;
    margin-bottom: 14px;
    white-space: pre-wrap;
}

.progress-row {
    display: flex;
    justify-content: space-between;
    margin: 14px 0 8px;
}

.progress {
    height: 10px;
    background: #1f2937;
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 15px;
}

.progress-fill {
    height: 100%;
    background: #22c55e;
    width: 0%;
}

.full .progress-fill {
    background: #ef4444;
}

.join-box {
    background: #0f172a;
    border: 1px solid #334155;
    padding: 12px;
    border-radius: 14px;
    margin-top: 15px;
}

.people {
    margin-top: 14px;
}

.person {
    background: #1f2937;
    padding: 10px;
    border-radius: 12px;
    margin-top: 8px;
}

.person-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
}

.person-name {
    word-break: break-word;
}

.badge {
    padding: 4px 8px;
    border-radius: 999px;
    font-size: 12px;
    white-space: nowrap;
}

.badge.waiting {
    background: #92400e;
    color: #fde68a;
}

.badge.done {
    background: #14532d;
    color: #bbf7d0;
}

.actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
}

.status-message {
    margin-top: 10px;
    color: #cbd5e1;
    font-size: 14px;
}

.empty,
.loader {
    text-align: center;
    color: #94a3b8;
    padding: 40px;
    background: #111827;
    border-radius: 18px;
}

.small-text {
    color: #94a3b8;
    font-size: 13px;
    margin-top: 6px;
}

@media (max-width: 700px) {
    header {
        padding: 32px 16px;
    }

    header h1 {
        font-size: 30px;
    }

    .container {
        padding: 14px;
    }

    .grid {
        grid-template-columns: 1fr;
    }

    button {
        width: 100%;
    }

    .actions {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<div id="loginScreen" class="login-screen">
    <div class="login-box">
        <h1>🔒 FIXDAY</h1>
        <p>Indtast adgangskode for at åbne siden</p>

        <input id="passwordInput" type="password" placeholder="Adgangskode">

        <button id="loginBtn">Åbn FIXDAY</button>

        <p id="loginError" style="display:none;color:#fca5a5;margin-top:15px;">
            Forkert adgangskode
        </p>
    </div>
</div>

<div id="appContainer" class="hidden">

    <header>
        <h1>🔧 FIXDAY</h1>
        <p>Opret opgaver, tilmeld personer og følg status</p>
    </header>

    <div class="container">

        <div class="top-actions">
            <button id="logoutBtn" class="secondary">Log ud</button>
        </div>

        <div class="dashboard">
            <div class="stat">
                <h2 id="taskCount">0</h2>
                <p>Opgaver</p>
            </div>

            <div class="stat">
                <h2 id="participantCount">0</h2>
                <p>Tilmeldinger</p>
            </div>
        </div>

        <div class="form">
            <h2>➕ Opret ny opgave</h2>

            <label>Opgavenavn</label>
            <input id="taskName" placeholder="Fx Ryd depot, flyt borde, mal væg">

            <label>Beskrivelse</label>
            <textarea id="taskDescription" placeholder="Beskriv hvad der skal laves"></textarea>

            <label>Max antal personer</label>
            <select id="taskMax">
                <option value="1">1 person</option>
                <option value="2">2 personer</option>
                <option value="3">3 personer</option>
                <option value="4">4 personer</option>
                <option value="5">5 personer</option>
                <option value="6">6 personer</option>
                <option value="7">7 personer</option>
                <option value="8">8 personer</option>
                <option value="9">9 personer</option>
                <option value="10">10 personer</option>
            </select>

            <label>Billede til opgaven</label>
            <input id="taskImage" type="file" accept="image/*">

            <p class="small-text">
                Billedet bliver automatisk komprimeret, så upload går hurtigere.
            </p>

            <button id="createTaskBtn">Opret opgave</button>

            <div id="createStatus" class="status-message"></div>
        </div>

        <div id="taskList" class="grid">
            <div class="loader">Indlæser opgaver...</div>
        </div>

    </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    doc,
    updateDoc,
    deleteDoc,
    onSnapshot,
    serverTimestamp,
    runTransaction,
    query,
    orderBy
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

import {
    getStorage,
    ref,
    uploadBytes,
    getDownloadURL,
    deleteObject
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-storage.js";

const firebaseConfig = {
    apiKey: "AIzaSyDeKIZcW1Mvi4lYvaKRMOWdKk3ikFXwEAU",
    authDomain: "huah-198fc.firebaseapp.com",
    projectId: "huah-198fc",
    storageBucket: "huah-198fc.firebasestorage.app",
    messagingSenderId: "276648968284",
    appId: "1:276648968284:web:029616d17546aa7d662699",
    measurementId: "G-J8V7DB0DF7"
};

const PASSWORD = "A2026";

const firebaseApp = initializeApp(firebaseConfig);
const db = getFirestore(firebaseApp);
const storage = getStorage(firebaseApp);

let allTasks = [];
let appStarted = false;

const loginScreen = document.getElementById("loginScreen");
const appContainer = document.getElementById("appContainer");
const passwordInput = document.getElementById("passwordInput");
const loginBtn = document.getElementById("loginBtn");
const loginError = document.getElementById("loginError");
const logoutBtn = document.getElementById("logoutBtn");

const taskName = document.getElementById("taskName");
const taskDescription = document.getElementById("taskDescription");
const taskMax = document.getElementById("taskMax");
const taskImage = document.getElementById("taskImage");
const createTaskBtn = document.getElementById("createTaskBtn");
const createStatus = document.getElementById("createStatus");
const taskList = document.getElementById("taskList");

loginBtn.addEventListener("click", login);

passwordInput.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        login();
    }
});

logoutBtn.addEventListener("click", function() {
    sessionStorage.removeItem("fixday_access");
    location.reload();
});

function checkLogin() {
    if (sessionStorage.getItem("fixday_access") === "ok") {
        loginScreen.classList.add("hidden");
        appContainer.classList.remove("hidden");
        startApp();
    }
}

function login() {
    const enteredPassword = passwordInput.value.trim();

    if (enteredPassword === PASSWORD) {
        sessionStorage.setItem("fixday_access", "ok");
        loginScreen.classList.add("hidden");
        appContainer.classList.remove("hidden");
        startApp();
    } else {
        loginError.style.display = "block";
        passwordInput.value = "";
        passwordInput.focus();
    }
}

function startApp() {
    if (appStarted) return;

    appStarted = true;
    createTaskBtn.addEventListener("click", createTask);

    const tasksQuery = query(
        collection(db, "tasks"),
        orderBy("createdAt", "desc")
    );

    onSnapshot(
        tasksQuery,
        function(snapshot) {
            allTasks = snapshot.docs.map(function(documentItem) {
                return {
                    id: documentItem.id,
                    ...documentItem.data()
                };
            });

            renderTasks();
        },
        function(error) {
            console.error(error);

            taskList.innerHTML = `
                <div class="empty">
                    Kunne ikke hente opgaver fra Firebase.
                    <br><br>
                    Tjek Firestore Rules i Firebase Console.
                </div>
            `;
        }
    );
}

async function createTask() {
    const name = taskName.value.trim();
    const description = taskDescription.value.trim();
    const max = parseInt(taskMax.value) || 1;
    const file = taskImage.files[0];

    if (!name) {
        alert("Skriv et opgavenavn");
        taskName.focus();
        return;
    }

    createTaskBtn.disabled = true;
    createStatus.textContent = "Gemmer opgave...";

    try {
        let imageUrl = "";
        let imagePath = "";

        if (file) {
            createStatus.textContent = "Komprimerer billede...";

            let imageBlob;

            try {
                imageBlob = await compressImage(file, 1200, 0.75);
            } catch (error) {
                console.warn("Kunne ikke komprimere billedet. Uploader original fil.", error);
                imageBlob = file;
            }

            createStatus.textContent = "Uploader billede...";

            const safeFileName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
            imagePath = "task-images/" + Date.now() + "-" + safeFileName + ".jpg";

            const imageRef = ref(storage, imagePath);

            await uploadBytes(imageRef, imageBlob, {
                contentType: "image/jpeg"
            });

            imageUrl = await getDownloadURL(imageRef);
        }

        await addDoc(collection(db, "tasks"), {
            name: name,
            description: description,
            max: max,
            imageUrl: imageUrl,
            imagePath: imagePath,
            people: [],
            createdAt: serverTimestamp()
        });

        taskName.value = "";
        taskDescription.value = "";
        taskMax.value = "1";
        taskImage.value = "";

        createStatus.textContent = "Opgaven er oprettet ✅";

        setTimeout(function() {
            createStatus.textContent = "";
        }, 2500);

    } catch (error) {
        console.error(error);
        alert("Kunne ikke oprette opgaven. Tjek Firestore og Storage regler.");
        createStatus.textContent = "Fejl ved oprettelse";
    }

    createTaskBtn.disabled = false;
}

function compressImage(file, maxWidth, quality) {
    return new Promise(function(resolve, reject) {
        const reader = new FileReader();

        reader.onload = function(event) {
            const img = new Image();

            img.onload = function() {
                let width = img.width;
                let height = img.height;

                if (width > maxWidth) {
                    height = Math.round((height * maxWidth) / width);
                    width = maxWidth;
                }

                const canvas = document.createElement("canvas");
                canvas.width = width;
                canvas.height = height;

                const ctx = canvas.getContext("2d");
                ctx.drawImage(img, 0, 0, width, height);

                canvas.toBlob(
                    function(blob) {
                        if (!blob) {
                            reject(new Error("Kunne ikke lave billede"));
                            return;
                        }

                        resolve(blob);
                    },
                    "image/jpeg",
                    quality
                );
            };

            img.onerror = reject;
            img.src = event.target.result;
        };

        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

function renderTasks() {
    let totalParticipants = 0;

    allTasks.forEach(function(task) {
        const people = Array.isArray(task.people) ? task.people : [];
        totalParticipants += people.length;
    });

    document.getElementById("taskCount").textContent = allTasks.length;
    document.getElementById("participantCount").textContent = totalParticipants;

    if (allTasks.length === 0) {
        taskList.innerHTML = `
            <div class="empty">
                Ingen opgaver endnu.
                <br>
                Opret den første opgave ovenfor.
            </div>
        `;
        return;
    }

    taskList.innerHTML = allTasks.map(function(task) {
        const people = Array.isArray(task.people) ? task.people : [];
        const max = task.max || 1;
        const percent = Math.min(100, Math.round((people.length / max) * 100));
        const isFull = people.length >= max;

        const imageHtml = task.imageUrl
            ? `${escapeHtml(task.imageUrl)}`
            : `<div class="no-img">📷</div>`;

        const peopleHtml = people.length
            ? people.map(function(person, index) {
                const done = person.done === true;

                return `
                    <div class="person">
                        <div class="person-top">
                            <span class="person-name">
                                ${done ? "✅" : "⏳"} ${escapeHtml(person.name)}
                            </span>

                            <span class="badge ${done ? "done" : "waiting"}">
                                ${done ? "Udført" : "Tilmeldt"}
                            </span>
                        </div>

                        <div class="actions">
                            ${!done ? `
                                done
                                    Markér udført
                                </button>
                            ` : ""}

                            remove-person
                                Fjern person
                            </button>
                        </div>
                    </div>
                `;
            }).join("")
            : `<p style="color:#94a3b8;margin-top:10px;">Ingen tilmeldte endnu</p>`;

        return `
            <div class="card ${isFull ? "full" : ""}">
                ${imageHtml}

                <div class="content">
                    <h3 class="task-title">${escapeHtml(task.name)}</h3>

                    <p class="description">${escapeHtml(task.description || "")}</p>

                    <div class="progress-row">
                        <span>Deltagere</span>
                        <strong>${people.length}/${max}</strong>
                    </div>

                    <div class="progress">
                        <div class="progress-fill" style="width:${percent}%"></div>
                    </div>

                    <div class="join-box">
                        <label>Skriv dit navn og tilmeld dig</label>

                        <input
                            id="joinName-${task.id}"
                            placeholder="Dit navn"
                            ${isFull ? "disabled" : ""}
                        >

                        join
                            ${isFull ? "Opgaven er fuld" : "Tilmeld mig"}
                        </button>
                    </div>

                    <div class="people">
                        ${peopleHtml}
                    </div>

                    <div class="actions">
                        edit
                            Rediger opgave
                        </button>

                        change-image
                            Skift billede
                        </button>

                        change-image-input

                        delete
                            Slet opgave
                        </button>
                    </div>
                </div>
            </div>
        `;
    }).join("");
}

taskList.addEventListener("click", async function(event) {
    const button = event.target.closest("button");
    if (!button) return;

    const action = button.dataset.action;
    const taskId = button.dataset.taskId;
    const personIndex = button.dataset.personIndex;

    if (!action || !taskId) return;

    if (action === "join") {
        await joinTask(taskId);
    }

    if (action === "edit") {
        await editTask(taskId);
    }

    if (action === "delete") {
        await deleteTask(taskId);
    }

    if (action === "done") {
        await completePerson(taskId, parseInt(personIndex));
    }

    if (action === "remove-person") {
        await removePerson(taskId, parseInt(personIndex));
    }

    if (action === "change-image") {
        const input = document.getElementById("changeImage-" + taskId);
        if (input) input.click();
    }
});

taskList.addEventListener("change", async function(event) {
    const input = event.target;

    if (input.dataset.action !== "change-image-input") return;

    const taskId = input.dataset.taskId;
    const file = input.files[0];

    if (!taskId || !file) return;

    await changeTaskImage(taskId, file);
});

async function joinTask(taskId) {
    const nameInput = document.getElementById("joinName-" + taskId);

    if (!nameInput) {
        alert("Navnefeltet blev ikke fundet");
        return;
    }

    const personName = nameInput.value.trim();

    if (!personName) {
        alert("Skriv dit navn først");
        nameInput.focus();
        return;
    }

    try {
        const taskRef = doc(db, "tasks", taskId);

        await runTransaction(db, async function(transaction) {
            const taskSnap = await transaction.get(taskRef);

            if (!taskSnap.exists()) {
                throw new Error("Opgaven findes ikke længere");
            }

            const task = taskSnap.data();
            const people = Array.isArray(task.people) ? task.people : [];
            const max = task.max || 1;

            const alreadyJoined = people.some(function(person) {
                return person.name.toLowerCase() === personName.toLowerCase();
            });

            if (alreadyJoined) {
                throw new Error("Du er allerede tilmeldt denne opgave");
            }

            if (people.length >= max) {
                throw new Error("Opgaven er fuld");
            }

            people.push({
                name: personName,
                done: false
            });

            transaction.update(taskRef, {
                people: people
            });
        });

        nameInput.value = "";

    } catch (error) {
        alert(error.message || "Kunne ikke tilmelde dig");
    }
}

async function editTask(taskId) {
    const task = allTasks.find(function(item) {
        return item.id === taskId;
    });

    if (!task) return;

    const newName = prompt("Ret opgavenavn", task.name || "");
    if (newName === null) return;

    const newDescription = prompt("Ret beskrivelse", task.description || "");
    if (newDescription === null) return;

    const currentMax = task.max || 1;
    const newMaxText = prompt("Ret max antal personer, 1-10", currentMax);
    if (newMaxText === null) return;

    let newMax = parseInt(newMaxText) || currentMax;

    if (newMax < 1) newMax = 1;
    if (newMax > 10) newMax = 10;

    const people = Array.isArray(task.people) ? task.people : [];

    if (newMax < people.length) {
        alert("Du kan ikke sætte max lavere end antal personer, der allerede er tilmeldt.");
        return;
    }

    try {
        await updateDoc(doc(db, "tasks", taskId), {
            name: newName.trim() || task.name,
            description: newDescription.trim(),
            max: newMax
        });
    } catch (error) {
        console.error(error);
        alert("Kunne ikke redigere opgaven");
    }
}

async function changeTaskImage(taskId, file) {
    const task = allTasks.find(function(item) {
        return item.id === taskId;
    });

    if (!task) return;

    try {
        alert("Uploader nyt billede. Vent et øjeblik.");

        let imageBlob;

        try {
            imageBlob = await compressImage(file, 1200, 0.75);
        } catch (error) {
            imageBlob = file;
        }

        const safeFileName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
        const newImagePath = "task-images/" + Date.now() + "-" + safeFileName + ".jpg";

        const imageRef = ref(storage, newImagePath);

        await uploadBytes(imageRef, imageBlob, {
            contentType: "image/jpeg"
        });

        const newImageUrl = await getDownloadURL(imageRef);

        await updateDoc(doc(db, "tasks", taskId), {
            imageUrl: newImageUrl,
            imagePath: newImagePath
        });

        if (task.imagePath) {
            try {
                await deleteObject(ref(storage, task.imagePath));
            } catch (error) {
                console.warn("Gammelt billede kunne ikke slettes.", error);
            }
        }

        alert("Billedet er opdateret ✅");

    } catch (error) {
        console.error(error);
        alert("Kunne ikke skifte billede. Tjek Firebase Storage regler.");
    }
}

async function deleteTask(taskId) {
    const task = allTasks.find(function(item) {
        return item.id === taskId;
    });

    if (!task) return;

    const yes = confirm("Vil du slette opgaven: " + task.name + "?");

    if (!yes) return;

    try {
        await deleteDoc(doc(db, "tasks", taskId));

        if (task.imagePath) {
            try {
                await deleteObject(ref(storage, task.imagePath));
            } catch (imageError) {
                console.warn("Opgaven blev slettet, men billedet kunne ikke slettes.", imageError);
            }
        }

    } catch (error) {
        console.error(error);
        alert("Kunne ikke slette opgaven");
    }
}

async function completePerson(taskId, personIndex) {
    const task = allTasks.find(function(item) {
        return item.id === taskId;
    });

    if (!task) return;

    const people = Array.isArray(task.people) ? [...task.people] : [];

    if (!people[personIndex]) return;

    people[personIndex].done = true;

    try {
        await updateDoc(doc(db, "tasks", taskId), {
            people: people
        });
    } catch (error) {
        console.error(error);
        alert("Kunne ikke markere som udført");
    }
}

async function removePerson(taskId, personIndex) {
    const task = allTasks.find(function(item) {
        return item.id === taskId;
    });

    if (!task) return;

    const people = Array.isArray(task.people) ? [...task.people] : [];

    if (!people[personIndex]) return;

    const yes = confirm("Vil du fjerne " + people[personIndex].name + " fra opgaven?");

    if (!yes) return;

    people.splice(personIndex, 1);

    try {
        await updateDoc(doc(db, "tasks", taskId), {
            people: people
        });
    } catch (error) {
        console.error(error);
        alert("Kunne ikke fjerne personen");
    }
}

function escapeHtml(value) {
    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

checkLogin();
