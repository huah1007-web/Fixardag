<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIXDAY Team Opgaver</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", Arial, sans-serif;
}

body {
    background: #0f172a;
    color: white;
    min-height: 100vh;
}

.hidden {
    display: none !important;
}

.login-screen {
    min-height: 100vh;
    background: linear-gradient(135deg, #0f172a, #1d4ed8);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.login-box {
    background: #111827;
    width: 100%;
    max-width: 420px;
    padding: 30px;
    border-radius: 22px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
}

.login-box h1 {
    margin-bottom: 10px;
}

.login-box p {
    color: #cbd5e1;
    margin-bottom: 18px;
}

header {
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    padding: 42px 20px;
    text-align: center;
}

header h1 {
    font-size: 38px;
    margin-bottom: 8px;
}

header p {
    color: #dbeafe;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

.dashboard {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
    margin-bottom: 20px;
}

.stat {
    background: #111827;
    padding: 20px;
    border-radius: 18px;
    text-align: center;
    box-shadow: 0 8px 20px rgba(0,0,0,0.18);
}

.stat h2 {
    font-size: 34px;
    color: #60a5fa;
}

.form {
    background: #111827;
    padding: 22px;
    border-radius: 18px;
    margin-bottom: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.18);
}

.form h2 {
    margin-bottom: 15px;
}

label {
    display: block;
    margin: 12px 0 6px;
    color: #cbd5e1;
    font-size: 14px;
}

input,
textarea,
select {
    width: 100%;
    padding: 13px;
    background: #1f2937;
    color: white;
    border: 1px solid #334155;
    border-radius: 12px;
    outline: none;
    font-size: 15px;
}

textarea {
    min-height: 90px;
    resize: vertical;
}

input:focus,
textarea:focus,
select:focus {
    border-color: #60a5fa;
}

button {
    background: #2563eb;
    color: white;
    border: none;
    padding: 12px 18px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 600;
    margin-top: 8px;
}

button:hover {
    background: #1d4ed8;
}

button.secondary {
    background: #374151;
}

button.secondary:hover {
    background: #4b5563;
}

button.danger {
    background: #dc2626;
}

button.danger:hover {
    background: #b91c1c;
}

button.success {
    background: #16a34a;
}

button.success:hover {
    background: #15803d;
}

button:disabled {
    background: #64748b;
    cursor: not-allowed;
}

.top-actions {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 15px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
    gap: 20px;
}

.card {
    background: #111827;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0,0,0,0.22);
}

.card-img {
    width: 100%;
    height: 230px;
    object-fit: cover;
    background: #1f2937;
}

.no-img {
    height: 180px;
    background: linear-gradient(135deg, #1e293b, #334155);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #94a3b8;
    font-size: 46px;
}

.content {
    padding: 20px;
}

.task-title {
    font-size: 22px;
    margin-bottom: 8px;
}

.description {
    color: #cbd5e1;
    margin-bottom: 14px;
    white-space: pre-wrap;
}

.progress-row {
    display: flex;
    justify-content: space-between;
    margin: 14px 0 8px;
    color: #e5e7eb;
}

.progress {
    height: 10px;
    background: #1f2937;
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 15px;
}

.progress-fill {
    height: 100%;
    background: #22c55e;
    width: 0%;
}

.full .progress-fill {
    background: #ef4444;
}

.join-box {
    background: #0f172a;
    border: 1px solid #334155;
    padding: 12px;
    border-radius: 14px;
    margin-top: 15px;
}

.join-box input {
    margin-bottom: 8px;
}

.people {
    margin-top: 14px;
}

.person {
    background: #1f2937;
    padding: 10px;
    border-radius: 12px;
    margin-top: 8px;
}

.person-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
}

.person-name {
    word-break: break-word;
}

.badge {
    padding: 4px 8px;
    border-radius: 999px;
    font-size: 12px;
    white-space: nowrap;
}

.badge.waiting {
    background: #92400e;
    color: #fde68a;
}

    color: #
