<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FixDay</title>

<style>
:root{
--bg:#0f172a;
--card:#111827;
--card2:#1e293b;
--primary:#3b82f6;
--success:#22c55e;
--warning:#f59e0b;
--danger:#ef4444;
--text:#f8fafc;
--muted:#94a3b8;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Segoe UI',sans-serif;
background:var(--bg);
color:var(--text);
}

header{
background:linear-gradient(135deg,#2563eb,#1d4ed8);
padding:60px 20px;
text-align:center;
}

header h1{
font-size:3rem;
}

header p{
color:#dbeafe;
margin-top:10px;
}

.container{
max-width:1400px;
margin:auto;
padding:20px;
}

.dashboard{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
margin-bottom:20px;
}

.stat{
background:var(--card);
padding:20px;
border-radius:20px;
text-align:center;
border:1px solid #334155;
}

.stat h2{
color:var(--primary);
font-size:2rem;
}

.panel{
background:var(--card);
padding:20px;
border-radius:20px;
margin-bottom:20px;
border:1px solid #334155;
}

.panel h2{
margin-bottom:15px;
}

input,textarea,select{
width:100%;
padding:12px;
margin-bottom:10px;
background:var(--card2);
border:1px solid #475569;
border-radius:12px;
color:white;
}

button{
padding:12px 16px;
border:none;
border-radius:12px;
cursor:pointer;
font-weight:600;
}

.primary{
background:var(--primary);
color:white;
}

.success{
background:var(--success);
color:white;
}

.warning{
background:var(--warning);
color:white;
}

.danger{
background:var(--danger);
color:white;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(360px,1fr));
gap:20px;
}

.card{
background:var(--card);
border-radius:24px;
overflow:hidden;
border:1px solid #334155;
}

.gallery{
display:flex;
overflow-x:auto;
scroll-snap-type:x mandatory;
}

.gallery img{
width:100%;
height:260px;
object-fit:cover;
flex:0 0 100%;
scroll-snap-align:center;
}

.content{
padding:20px;
}

.content h3{
margin-bottom:10px;
}

.meta{
display:flex;
flex-wrap:wrap;
gap:10px;
margin:10px 0;
}

.tag{
padding:6px 10px;
border-radius:20px;
font-size:12px;
font-weight:bold;
}

.high{background:#991b1b}
.medium{background:#92400e}
.low{background:#166534}

.progress{
height:10px;
background:#334155;
border-radius:999px;
overflow:hidden;
margin:12px 0;
}

.bar{
background:linear-gradient(90deg,#22c55e,#16a34a);
height:100%;
}

.people{
margin-top:10px;
}

.person{
background:var(--card2);
padding:10px;
margin-top:8px;
border-radius:10px;
display:flex;
justify-content:space-between;
align-items:center;
}

.actions{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:15px;
}

.status{
display:inline-block;
padding:8px 12px;
border-radius:999px;
font-weight:bold;
margin-bottom:10px;
}

.green{background:#166534;}
.yellow{background:#92400e;}
.red{background:#991b1b;}

@media(max-width:768px){

header h1{
font-size:2rem;
}

.gallery img{
height:220px;
}

}
</style>
</head>
<body>

<header>
<h1>🔧 FixDay</h1>
<p>Work Together. Get Things Done.</p>
</header>

<div class="container">

<div class="dashboard">

<div class="stat">
<h2 id="taskCount">0</h2>
<div>Tasks</div>
</div>

<div class="stat">
<h2 id="participantCount">0</h2>
<div>Participants</div>
</div>

<div class="stat">
<h2 id="availableCount">0</h2>
<div>Available Slots</div>
</div>

</div>

<div class="panel">

<h2>Create Task</h2>

<input id="title" placeholder="Task Title">

<textarea id="description" placeholder="Description"></textarea>

<input id="location" placeholder="Location">

<input id="dueDate" type="date">

<select id="priority">
<option>Low</option>
<option selected>Medium</option>
<option>High</option>
</select>

<input id="maxPeople" type="number" value="4" min="1">

<input id="images" type="file" multiple accept="image/*">

<button class="primary" onclick="createTask()">
Create Task
</button>

</div>

<input
id="search"
placeholder="Search tasks..."
onkeyup="renderTasks()">

<br><br>

<div id="taskGrid" class="grid"></div>

</div>

<script>

let tasks =
JSON.parse(localStorage.getItem("fixday")) || [];

function save(){
localStorage.setItem(
"fixday",
JSON.stringify(tasks)
);
}

function createTask(){

const title=document.getElementById("title").value.trim();
if(!title)return alert("Task title required");

const task={
title:title,
description:document.getElementById("description").value,
location:document.getElementById("location").value,
dueDate:document.getElementById("dueDate").value,
priority:document.getElementById("priority").value,
max:parseInt(document.getElementById("maxPeople").value),
images:[],
people:[]
};

const files=document.getElementById("images").files;

if(files.length===0){
tasks.push(task);
save();
renderTasks();
return;
}

let loaded=0;

for(let file of files){

const reader=new FileReader();

reader.onload=function(e){

task.images.push(e.target.result);

loaded++;

if(loaded===files.length){
tasks.push(task);
save();
renderTasks();
}

};

reader.readAsDataURL(file);

}

}

function joinTask(index){

const name=prompt("Enter your name");

if(!name)return;

const task=tasks[index];

if(task.people.length>=task.max){
alert("No slots available");
return;
}

if(task.people.some(
p=>p.name.toLowerCase()===name.toLowerCase()
)){
alert("Already joined");
return;
}

task.people.push({
name:name,
done:false
});

save();
renderTasks();

}

function completeTask(t,p){

tasks[t].people[p].done=true;

save();
renderTasks();

}

function editTask(index){

const title=
prompt("New task name",tasks[index].title);

if(title){
tasks[index].title=title;
save();
renderTasks();
}

}

function deleteTask(index){

if(confirm("Delete task?")){
tasks.splice(index,1);
save();
renderTasks();
}

}

function renderTasks(){

const search=
document.getElementById("search")
.value
.toLowerCase();

let html="";
let countPeople=0;
let countSlots=0;

tasks.forEach((task,index)=>{

if(
!task.title.toLowerCase().includes(search)
)return;

countPeople += task.people.length;

const free =
task.max-task.people.length;

countSlots += free;

let badge="green";
let text=`${free} slots available`;

if(free===0){
badge="red";
text="Full";
}
else if(free<=2){
badge="yellow";
text=`${free} remaining`;
}

const percent=
(task.people.length/task.max)*100;

html += `

<div class="card">

<div class="gallery">

${
task.images.length
?
task.images.map(img =>
`${img}`
).join("")
:
`https://picsum.photos/800/450?random=${index}`
}

</div>

<div class="content">

<div class="status ${badge}">
${text}
</div>

<h3>${task.title}</h3>

<p>${task.description}</p>

<div class="meta">

<div class="tag ${task.priority.toLowerCase()}">
${task.priority}
</div>

<div class="tag">
📍 ${task.location || "No location"}
</div>

<div class="tag">
📅 ${task.dueDate || "No date"}
</div>

</div>

<div>
👥 ${task.people.length}/${task.max}
</div>

<div class="progress">
<div class="bar" style="width:${percent}%"></div>
</div>

<div class="actions">

<button class="primary"
onclick="joinTask(${index})">
Join
</button>

<button class="warning"
onclick="editTask(${index})">
Edit
</button>

<button class="danger"
onclick="deleteTask(${index})">
Delete
</button>

</div>

<div class="people">

${task.people.map((p,i)=>`

<div class="person">

<span>
${p.done ? "✅" : "⏳"} ${p.name}
</span>

${!p.done ?
`<button class="success"
onclick="completeTask(${index},${i})">
Done
</button>`
: ""
}

</div>

`).join("")}

</div>

</div>

</div>

`;

});

document.getElementById("taskGrid").innerHTML=html;
document.getElementById("taskCount").innerText=tasks.length;
document.getElementById("participantCount").innerText=countPeople;
document.getElementById("availableCount").innerText=countSlots;

}

renderTasks();

</script>

</body>
</html>
