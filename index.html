<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>FIXDAY Teamuppgifter</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI",Arial,sans-serif}html{-webkit-text-size-adjust:100%}body{background:#0f172a;color:#fff;min-height:100dvh}.hidden{display:none!important}button,input,textarea{font:inherit}.login-screen{min-height:100dvh;display:grid;place-items:center;padding:18px;background:linear-gradient(135deg,#0f172a,#1e3a8a)}.login-box,.panel,.card,.stat{background:#111827;border:1px solid #253047;box-shadow:0 12px 30px #0004}.login-box{width:min(100%,430px);padding:24px;border-radius:22px;text-align:center}.login-box h1{margin-bottom:8px}.muted{color:#cbd5e1}.role-selector{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0 12px}.role-option{background:#1f2937;border:1px solid #334155;color:#cbd5e1;margin:0;min-height:58px}.role-option.active{background:#2563eb;border-color:#93c5fd;box-shadow:0 0 0 3px #60a5fa33}.role-option small{display:block;margin-top:3px}.field-group{margin-top:10px}input,textarea{width:100%;padding:13px;min-height:48px;border-radius:12px;border:1px solid #334155;background:#1f2937;color:#fff;outline:none;font-size:16px}input:focus,textarea:focus{border-color:#60a5fa;box-shadow:0 0 0 3px #60a5fa2e}textarea{min-height:100px;resize:vertical}label{display:block;text-align:left;color:#cbd5e1;font-size:14px;font-weight:600;margin:13px 0 6px}button{border:0;border-radius:12px;padding:12px 17px;min-height:46px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer;margin-top:8px;touch-action:manipulation}button.secondary{background:#374151}button.success{background:#16a34a}button.danger{background:#dc2626}button:disabled{background:#64748b;cursor:not-allowed}.login-btn{width:100%;margin-top:14px}.error{color:#fca5a5;margin-top:12px}.login-note{font-size:13px;color:#94a3b8;margin-top:12px}header{background:linear-gradient(135deg,#2563eb,#1d4ed8);padding:34px 18px;text-align:center}header h1{font-size:36px}header p{color:#dbeafe;margin-top:6px}.container{width:min(100%,1200px);margin:auto;padding:18px;padding-bottom:max(28px,env(safe-area-inset-bottom))}.top-actions{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-bottom:15px}.role-badge{background:#1f2937;border:1px solid #334155;border-radius:999px;padding:8px 12px;color:#cbd5e1;font-size:13px;font-weight:700}.dashboard{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:20px}.stat{border-radius:18px;padding:18px;text-align:center}.stat h2{color:#60a5fa;font-size:32px}.admin-panel{margin-bottom:22px}.toggle{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;background:#111827;border:1px solid #253047;padding:15px 18px;margin:0}.toggle-icon{font-size:21px;transition:transform .2s}.toggle[aria-expanded=true] .toggle-icon{transform:rotate(180deg)}.admin-panel.collapsed .panel{display:none}.panel{border-radius:18px;padding:20px;margin-top:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(310px,100%),1fr));gap:18px}.card{border-radius:20px;overflow:hidden;min-width:0}.card-image{height:220px;background:#1f2937;position:relative}.card-img{width:100%;height:100%;display:block;object-fit:cover}.no-img,.image-error{height:180px;display:flex;align-items:center;justify-content:center;flex-direction:column;background:linear-gradient(135deg,#1e293b,#334155);color:#94a3b8;font-size:45px}.image-error{display:none;position:absolute;inset:0;height:100%}.image-error span,.no-img span{font-size:13px}.content{padding:18px}.task-title{font-size:21px;overflow-wrap:anywhere}.description{color:#cbd5e1;white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0 14px}.progress-row{display:flex;justify-content:space-between;margin:12px 0 7px}.progress{height:10px;border-radius:99px;background:#1f2937;overflow:hidden}.progress-fill{height:100%;background:#22c55e}.full .progress-fill{background:#ef4444}.person{display:flex;justify-content:space-between;gap:8px;background:#1f2937;border-radius:11px;padding:10px;margin-top:9px}.badge{border-radius:99px;padding:4px 8px;font-size:12px;white-space:nowrap}.waiting{background:#92400e;color:#fde68a}.done{background:#14532d;color:#bbf7d0}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.actions button{margin:0}.status{min-height:20px;margin-top:10px;color:#cbd5e1}.empty,.loader{grid-column:1/-1;text-align:center;padding:35px;background:#111827;color:#94a3b8;border-radius:18px}.modal{position:fixed;inset:0;z-index:100;background:#000d;display:grid;place-items:center;padding:18px}.modal-content{width:min(100%,520px);max-height:90dvh;overflow:auto;background:#111827;border:1px solid #374151;border-radius:20px;padding:22px}.modal-actions{display:flex;gap:10px;margin-top:18px}.preview{margin:14px 0;background:#1f2937;padding:10px;border-radius:12px;text-align:center}.preview img{max-width:100%;max-height:220px;object-fit:contain;border-radius:8px}
@media(max-width:700px){.login-screen{padding:12px}.login-box{padding:21px 15px}.role-selector{gap:8px}.role-option{padding:9px 6px;min-height:60px}header{padding:23px 14px}header h1{font-size:28px}.container{padding:12px}.stat{padding:14px 8px}.stat h2{font-size:26px}.top-actions{gap:7px}.top-actions button{margin:0}.toggle{min-height:54px;padding:14px}.panel{padding:16px 14px}.grid{grid-template-columns:1fr;gap:15px}.card-image{height:195px}.content{padding:15px}.person{flex-direction:column;align-items:flex-start}.actions{flex-direction:column}.actions button{width:100%;min-height:48px}.modal{place-items:end center;padding:0}.modal-content{width:100%;max-height:94dvh;border-radius:20px 20px 0 0;padding:19px 14px max(20px,env(safe-area-inset-bottom))}.modal-actions{flex-direction:column}.modal-actions button{width:100%}}
@media(max-width:380px){.dashboard{grid-template-columns:1fr}.role-selector{grid-template-columns:1fr}.role-option{min-height:52px}}
</style>
</head>
<body>
<div id="loginScreen" class="login-screen"><div class="login-box"><h1>🔒 FIXDAY</h1><p class="muted">Välj hur du vill logga in</p><div class="role-selector" role="group"><button id="parentRoleBtn" class="role-option active" type="button">👤 Förälder<small>Se och anmäl</small></button><button id="adminRoleBtn" class="role-option" type="button">⚙️ Admin<small>Full åtkomst</small></button></div><div id="usernameGroup" class="field-group hidden"><input id="usernameInput" placeholder="Användarnamn" autocomplete="username"></div><div class="field-group"><input id="passwordInput" type="password" placeholder="Lösenord" autocomplete="current-password"></div><button id="loginBtn" class="login-btn" type="button">Logga in som förälder</button><p id="loginError" class="error hidden">Fel användarnamn eller lösenord</p><p class="login-note">Förälder ser endast lösenordsfältet. Admin anger både användarnamn och lösenord.</p></div></div>
<div id="app" class="hidden"><header><h1>🔧 FIXDAY</h1><p>Teamuppgifter, bilder och anmälningar</p></header><main class="container"><div class="top-actions"><span id="roleBadge" class="role-badge"></span><button id="logoutBtn" class="secondary" type="button">Logga ut</button></div><section class="dashboard"><div class="stat"><h2 id="taskCount">0</h2><p>Uppgifter</p></div><div class="stat"><h2 id="participantCount">0</h2><p>Anmälningar</p></div></section><section id="adminPanel" class="admin-panel collapsed hidden"><button id="formToggle" class="toggle" type="button" aria-expanded="false"><span>➕ Skapa ny uppgift</span><span class="toggle-icon">⌄</span></button><div class="panel"><label for="taskName">Uppgiftens namn</label><input id="taskName" placeholder="T.ex. städa förrådet eller måla en vägg"><label for="taskDescription">Beskrivning</label><textarea id="taskDescription" placeholder="Beskriv vad som ska göras"></textarea><label for="taskMax">Max antal personer</label><input id="taskMax" type="number" value="1" min="1"><label for="taskImage">Bild till uppgiften</label><input id="taskImage" type="file" accept="image/*"><button id="createTaskBtn" type="button">Skapa uppgift</button><div id="createStatus" class="status"></div></div></section><section id="taskList" class="grid"><div class="loader">Laddar uppgifter...</div></section></main></div>
<div id="editModal" class="modal hidden"><div class="modal-content"><h2>✏️ Redigera uppgift</h2><label for="editName">Uppgiftens namn</label><input id="editName"><label for="editDescription">Beskrivning</label><textarea id="editDescription"></textarea><label for="editMax">Max antal personer</label><input id="editMax" type="number" min="1"><div id="currentImageBox" class="preview hidden"><p>Nuvarande bild</p><img id="editPreview" alt="Nuvarande bild"><button id="removeImageBtn" class="danger" type="button">Ta bort bilden</button></div><label for="editImage">Ny bild</label><input id="editImage" type="file" accept="image/*"><div id="editStatus" class="status"></div><div class="modal-actions"><button id="saveEditBtn" class="success" type="button">Spara</button><button id="cancelEditBtn" class="secondary" type="button">Avbryt</button></div></div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import{getFirestore,collection,addDoc,doc,updateDoc,deleteDoc,onSnapshot,serverTimestamp,runTransaction}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
import{getStorage,ref,uploadBytes,uploadString,getDownloadURL,deleteObject}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-storage.js";
const firebaseConfig={apiKey:"AIzaSyDeKIZcW1Mvi4lYvaKRMOWdKk3ikFXwEAU",authDomain:"huah-198fc.firebaseapp.com",projectId:"huah-198fc",storageBucket:"huah-198fc.firebasestorage.app",messagingSenderId:"276648968284",appId:"1:276648968284:web:029616d17546aa7d662699",measurementId:"G-J8V7DB0DF7"};
const fb=initializeApp(firebaseConfig),db=getFirestore(fb),storage=getStorage(fb);const $=id=>document.getElementById(id);let role="user",tasks=[],started=false,editing=null,removeImage=false;
const ADMIN_USER="Admin",ADMIN_PASS="A2026",PARENT_PASS="F2026";
function selectRole(r){role=r;const admin=r==="admin";$("parentRoleBtn").classList.toggle("active",!admin);$("adminRoleBtn").classList.toggle("active",admin);$("usernameGroup").classList.toggle("hidden",!admin);$("usernameInput").value="";$("passwordInput").value="";$("loginBtn").textContent=admin?"Logga in som admin":"Logga in som förälder";$("loginError").classList.add("hidden");setTimeout(()=>$(admin?"usernameInput":"passwordInput").focus(),50)}
function enterApp(r){role=r;sessionStorage.setItem("fixday_access","ok");sessionStorage.setItem("fixday_role",r);$("loginScreen").classList.add("hidden");$("app").classList.remove("hidden");$("adminPanel").classList.toggle("hidden",r!=="admin");$("roleBadge").textContent=r==="admin"?"⚙️ Admin":"👤 Förälder";startApp();render()}
function login(){const u=$("usernameInput").value.trim(),p=$("passwordInput").value.trim();if(role==="admin"&&u===ADMIN_USER&&p===ADMIN_PASS)enterApp("admin");else if(role==="user"&&p===PARENT_PASS)enterApp("user");else{$("loginError").classList.remove("hidden");$("passwordInput").value="";$("passwordInput").focus()}}
$("parentRoleBtn").onclick=()=>selectRole("user");$("adminRoleBtn").onclick=()=>selectRole("admin");$("loginBtn").onclick=login;$("usernameInput").onkeydown=e=>{if(e.key==="Enter")$("passwordInput").focus()};$("passwordInput").onkeydown=e=>{if(e.key==="Enter")login()};$("logoutBtn").onclick=()=>{sessionStorage.clear();location.reload()};$("formToggle").onclick=()=>{const c=$("adminPanel").classList.toggle("collapsed");$("formToggle").setAttribute("aria-expanded",String(!c))};
function startApp(){if(started)return;started=true;onSnapshot(collection(db,"tasks"),s=>{tasks=s.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));render()},e=>{$("taskList").innerHTML='<div class="empty">Det gick inte att hämta uppgifterna.</div>';console.error(e)})}
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}function imageHtml(t){if(!t.imageUrl)return'<div class="no-img">📷<span>Ingen bild</span></div>';return`<div class="card-image"><img class="card-img" src="${esc(t.imageUrl)}" alt="Uppgiftsbild" loading="lazy" data-img><div class="image-error">📷<span>Bilden kunde inte laddas</span></div></div>`}
function render(){if(!$("taskList"))return;let total=0;tasks.forEach(t=>total+=(t.people||[]).length);$("taskCount").textContent=tasks.length;$("participantCount").textContent=total;if(!tasks.length){$("taskList").innerHTML='<div class="empty">Inga uppgifter ännu.</div>';return}$("taskList").innerHTML=tasks.map(t=>{const people=Array.isArray(t.people)?t.people:[],max=Number(t.max)||1,full=people.length>=max,pct=Math.min(100,Math.round(people.length/max*100));const persons=people.length?people.map((p,i)=>`<div class="person"><span>${p.done?"✅":"⏳"} ${esc(p.name)}</span><span class="badge ${p.done?"done":"waiting"}">${p.done?"Slutförd":"Pågår"}</span></div>${role==="admin"?`<div class="actions">${!p.done?`<button class="success" data-a="done" data-id="${t.id}" data-i="${i}">Markera som klar</button>`:""}<button class="danger" data-a="remove" data-id="${t.id}" data-i="${i}">Ta bort person</button></div>`:""}`).join(""):'<p class="muted" style="margin-top:10px">Inga deltagare ännu</p>';return`<article class="card ${full?"full":""}">${imageHtml(t)}<div class="content"><h3 class="task-title">${esc(t.name)}</h3><p class="description">${esc(t.description||"")}</p><div class="progress-row"><span>Deltagare</span><strong>${people.length}/${max}</strong></div><div class="progress"><div class="progress-fill" style="width:${pct}%"></div></div>${persons}<div class="actions"><button class="success" data-a="join" data-id="${t.id}" ${full?"disabled":""}>${full?"Uppgiften är full":"Anmäl mig"}</button>${role==="user"?`<button class="secondary" data-a="complete-self" data-id="${t.id}">Markera min uppgift som klar</button>`:""}${role==="admin"?`<button class="secondary" data-a="edit" data-id="${t.id}">Redigera</button><button class="danger" data-a="delete" data-id="${t.id}">Radera</button>`:""}</div></div></article>`}).join("")}
$("taskList").addEventListener("error",e=>{if(e.target.matches("img[data-img]")){e.target.style.display="none";e.target.nextElementSibling.style.display="flex"}},true);
$("taskList").onclick=async e=>{const b=e.target.closest("button");if(!b)return;const a=b.dataset.a,id=b.dataset.id,i=Number(b.dataset.i);if(a==="join")await join(id);else if(a==="complete-self")await completeSelf(id);else if(role!=="admin")return;else if(a==="edit")openEdit(id);else if(a==="delete")await del(id);else if(a==="done")await personUpdate(id,i,"done");else if(a==="remove")await personUpdate(id,i,"remove")};
function compress(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=e=>{const im=new Image();im.onload=()=>{let w=im.width,h=im.height;if(w>1000){h=Math.round(h*1000/w);w=1000}const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(im,0,0,w,h);resolve(c.toDataURL("image/jpeg",.75))};im.onerror=reject;im.src=e.target.result};r.onerror=reject;r.readAsDataURL(file)})}
async function upload(file){const path=`task-images/task_${Date.now()}.${(file.name.split(".").pop()||"jpg")}`,r=ref(storage,path);try{await uploadString(r,await compress(file),"data_url")}catch{await uploadBytes(r,file)}return{imageUrl:await getDownloadURL(r),imagePath:path}}
$("createTaskBtn").onclick=async()=>{if(role!=="admin")return;const name=$("taskName").value.trim(),description=$("taskDescription").value.trim(),max=parseInt($("taskMax").value)||1,file=$("taskImage").files[0];if(!name)return alert("Ange ett namn på uppgiften.");const b=$("createTaskBtn");b.disabled=true;try{let imageUrl="",imagePath="";if(file)({imageUrl,imagePath}=await upload(file));await addDoc(collection(db,"tasks"),{name,description,max,imageUrl,imagePath,people:[],createdAt:serverTimestamp()});$("taskName").value="";$("taskDescription").value="";$("taskMax").value="1";$("taskImage").value="";$("createStatus").textContent="Uppgiften har skapats ✅";setTimeout(()=>{$("createStatus").textContent="";$("adminPanel").classList.add("collapsed");$("formToggle").setAttribute("aria-expanded","false")},1500)}catch(e){console.error(e);$("createStatus").textContent="Ett fel inträffade."}finally{b.disabled=false}};
async function join(id){const n=prompt("Ange ditt namn:");if(!n?.trim())return;try{await runTransaction(db,async tx=>{const r=doc(db,"tasks",id),s=await tx.get(r);if(!s.exists())throw Error("Uppgiften finns inte.");const d=s.data(),p=Array.isArray(d.people)?[...d.people]:[];if(p.some(x=>x.name.toLowerCase()===n.trim().toLowerCase()))throw Error("Du är redan anmäld.");if(p.length>=(d.max||1))throw Error("Uppgiften är full.");p.push({name:n.trim(),done:false});tx.update(r,{people:p})})}catch(e){alert(e.message)}}
async function completeSelf(id){
    const name=prompt("Ange samma namn som du använde vid anmälan:");
    if(!name?.trim())return;
    try{
        await runTransaction(db,async tx=>{
            const taskRef=doc(db,"tasks",id);
            const snapshot=await tx.get(taskRef);
            if(!snapshot.exists())throw Error("Uppgiften finns inte längre.");
            const data=snapshot.data();
            const people=Array.isArray(data.people)?data.people.map(person=>({...person})):[];
            const index=people.findIndex(person=>String(person.name||"").toLocaleLowerCase("sv-SE")===name.trim().toLocaleLowerCase("sv-SE"));
            if(index<0)throw Error("Namnet finns inte bland de anmälda till uppgiften.");
            if(people[index].done===true)throw Error("Uppgiften är redan markerad som slutförd.");
            people[index].done=true;
            tx.update(taskRef,{people});
        });
        alert("Uppgiften har markerats som slutförd ✅");
    }catch(error){
        alert(error.message||"Det gick inte att uppdatera uppgiften.");
    }
}
function openEdit(id){editing=tasks.find(t=>t.id===id);if(!editing)return;$("editName").value=editing.name||"";$("editDescription").value=editing.description||"";$("editMax").value=editing.max||1;$("editImage").value="";removeImage=false;if(editing.imageUrl){$("editPreview").src=editing.imageUrl;$("currentImageBox").classList.remove("hidden")}else $("currentImageBox").classList.add("hidden");$("editModal").classList.remove("hidden")}
$("cancelEditBtn").onclick=()=>$("editModal").classList.add("hidden");$("removeImageBtn").onclick=()=>{removeImage=true;$("currentImageBox").classList.add("hidden")};$("saveEditBtn").onclick=async()=>{if(!editing||role!=="admin")return;const data={name:$("editName").value.trim(),description:$("editDescription").value.trim(),max:parseInt($("editMax").value)||1},file=$("editImage").files[0];if(!data.name)return alert("Ange ett namn.");try{let newPath="";if(file){const u=await upload(file);Object.assign(data,u);newPath=u.imagePath}else if(removeImage){data.imageUrl="";data.imagePath=""}await updateDoc(doc(db,"tasks",editing.id),data);if((file||removeImage)&&editing.imagePath&&editing.imagePath!==newPath)deleteObject(ref(storage,editing.imagePath)).catch(console.warn);$("editModal").classList.add("hidden")}catch(e){alert("Det gick inte att spara.")}};
async function del(id){const t=tasks.find(x=>x.id===id);if(!t||!confirm(`Radera ${t.name}?`))return;await deleteDoc(doc(db,"tasks",id));if(t.imagePath)deleteObject(ref(storage,t.imagePath)).catch(console.warn)}
async function personUpdate(id,i,mode){await runTransaction(db,async tx=>{const r=doc(db,"tasks",id),s=await tx.get(r),p=s.data().people.map(x=>({...x}));if(mode==="done")p[i].done=true;else if(confirm(`Ta bort ${p[i].name}?`))p.splice(i,1);else return;tx.update(r,{people:p})})}
const savedRole=sessionStorage.getItem("fixday_role");if(sessionStorage.getItem("fixday_access")==="ok"&&(savedRole==="admin"||savedRole==="user"))enterApp(savedRole);else selectRole("user");
</script>
</body>
</html>
