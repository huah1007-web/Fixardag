<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
>

<title>FIXDAY Teamuppgifter</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", Arial, sans-serif;
}

html {
    scroll-behavior: smooth;
    -webkit-text-size-adjust: 100%;
}

body {
    background: #0f172a;
    color: #ffffff;
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
}

body.modal-open {
    overflow: hidden;
}

button,
input,
textarea {
    font: inherit;
}

button {
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
}

img {
    max-width: 100%;
}

.hidden {
    display: none !important;
}

/* LOGIN */

.login-screen {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0f172a, #1e3a8a);
    padding:
        max(20px, env(safe-area-inset-top))
        max(20px, env(safe-area-inset-right))
        max(20px, env(safe-area-inset-bottom))
        max(20px, env(safe-area-inset-left));
}

.login-box {
    background: #111827;
    padding: 30px;
    border-radius: 22px;
    width: 100%;
    max-width: 420px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    border: 1px solid rgba(255, 255, 255, 0.06);
}

.login-box h1 {
    margin-bottom: 10px;
}

.login-box p {
    color: #cbd5e1;
    margin-bottom: 20px;
    line-height: 1.5;
}

.login-box input {
    text-align: center;
    font-size: 18px;
}

.login-box button {
    width: 100%;
}

/* HEADER */

header {
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    padding: 45px 20px;
    padding-top: max(
        45px,
        calc(25px + env(safe-area-inset-top))
    );
    text-align: center;
}

header h1 {
    font-size: 38px;
    margin-bottom: 8px;
}

header p {
    color: #dbeafe;
}

/* SIDANS HUVUDINNEHÅLL */

.container {
    width: 100%;
    max-width: 1200px;
    margin: auto;
    padding: 20px;
    padding-left: max(20px, env(safe-area-inset-left));
    padding-right: max(20px, env(safe-area-inset-right));
    padding-bottom: max(30px, env(safe-area-inset-bottom));
}

/* ÖVERSTA KNAPPAR */

.top-actions {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 15px;
}

/* ÖVERSIKT */

.dashboard {
    display: grid;
    grid-template-columns: repeat(
        auto-fit,
        minmax(180px, 1fr)
    );
    gap: 15px;
    margin-bottom: 20px;
}

.stat {
    background: #111827;
    padding: 20px;
    border-radius: 18px;
    text-align: center;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
    border: 1px solid rgba(255, 255, 255, 0.05);
}

.stat h2 {
    font-size: 34px;
    color: #60a5fa;
    margin-bottom: 4px;
}

/* FORMULÄR */

.form {
    background: #111827;
    padding: 22px;
    border-radius: 18px;
    margin-bottom: 24px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
    border: 1px solid rgba(255, 255, 255, 0.05);
}

.form h2 {
    margin-bottom: 15px;
}

label {
    display: block;
    margin: 14px 0 6px;
    color: #cbd5e1;
    font-size: 14px;
    font-weight: 600;
}

input,
textarea {
    display: block;
    width: 100%;
    padding: 13px;
    min-height: 48px;
    background: #1f2937;
    color: #ffffff;
    border: 1px solid #334155;
    border-radius: 12px;
    outline: none;
    transition:
        border-color 0.2s,
        box-shadow 0.2s;
}

input::placeholder,
textarea::placeholder {
    color: #94a3b8;
    opacity: 1;
}

textarea {
    min-height: 100px;
    resize: vertical;
    line-height: 1.5;
}

input:focus,
textarea:focus {
    border-color: #60a5fa;
    box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.18);
}

input[type="file"] {
    padding: 9px;
    cursor: pointer;
}

input[type="file"]::file-selector-button {
    background: #334155;
    color: #ffffff;
    border: none;
    border-radius: 9px;
    padding: 9px 12px;
    margin-right: 10px;
    cursor: pointer;
}

/* KNAPPAR */

button {
    background: #2563eb;
    color: #ffffff;
    border: none;
    min-height: 44px;
    padding: 12px 18px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 600;
    margin-top: 8px;
    transition:
        background 0.2s,
        transform 0.1s,
        opacity 0.2s;
}

button:hover {
    background: #1d4ed8;
}

button:active {
    transform: scale(0.98);
}

button:focus-visible {
    outline: 3px solid rgba(147, 197, 253, 0.8);
    outline-offset: 2px;
}

button.secondary {
    background: #374151;
}

button.secondary:hover {
    background: #4b5563;
}

button.danger {
    background: #dc2626;
}

button.danger:hover {
    background: #b91c1c;
}

button.success {
    background: #16a34a;
}

button.success:hover {
    background: #15803d;
}

button:disabled {
    background: #64748b;
    cursor: not-allowed;
    opacity: 0.8;
    transform: none;
}

/* UPPGIFTSRUTNÄT */

.grid {
    display: grid;
    grid-template-columns: repeat(
        auto-fit,
        minmax(min(310px, 100%), 1fr)
    );
    gap: 20px;
}

.card {
    min-width: 0;
    background: #111827;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
    display: flex;
    flex-direction: column;
    border: 1px solid rgba(255, 255, 255, 0.05);
}

/*
    VIKTIG BILDFIX:
    Bilden visas som ett riktigt img-element och URL-adressen
    visas därför inte längre som vanlig text.
*/

.card-image-wrapper {
    position: relative;
    width: 100%;
    height: 230px;
    flex-shrink: 0;
    overflow: hidden;
    background: #1f2937;
}

.card-img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #1f2937;
}

.no-img {
    width: 100%;
    height: 180px;
    background: linear-gradient(135deg, #1e293b, #334155);
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: center;
    justify-content: center;
    color: #94a3b8;
    font-size: 48px;
}

.no-img span {
    font-size: 13px;
    font-weight: 600;
}

.card-image-error {
    display: none;
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #1e293b, #334155);
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 6px;
    color: #94a3b8;
    text-align: center;
    padding: 20px;
}

.card-image-error strong {
    font-size: 42px;
}

.card-image-error span {
    font-size: 13px;
}

.content {
    padding: 20px;
    flex: 1;
    min-width: 0;
}

.task-title {
    font-size: 22px;
    margin-bottom: 8px;
    overflow-wrap: anywhere;
}

.description {
    color: #cbd5e1;
    margin-bottom: 14px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    line-height: 1.5;
}

.progress-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 14px 0 8px;
    color: #e5e7eb;
}

.progress {
    height: 10px;
    background: #1f2937;
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 15px;
}

.progress-fill {
    height: 100%;
    background: #22c55e;
    width: 0%;
    transition: width 0.3s ease;
}

.full .progress-fill {
    background: #ef4444;
}

/* DELTAGARE */

.people {
    margin-top: 10px;
}

.person {
    background: #1f2937;
    padding: 11px;
    border-radius: 12px;
    margin-top: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
}

.person-name {
    min-width: 0;
    word-break: break-word;
}

.badge {
    display: inline-block;
    padding: 4px 8px;
    border-radius: 999px;
    font-size: 12px;
    white-space: nowrap;
}

.badge.waiting {
    background: #92400e;
    color: #fde68a;
}

.badge.done {
    background: #14532d;
    color: #bbf7d0;
}

/* HANDLINGAR */

.actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 16px;
}

.actions button {
    margin-top: 0;
}

.person-actions {
    margin-top: 8px;
    margin-bottom: 14px;
}

/* STATUSMEDDELANDEN */

.status-message {
    min-height: 20px;
    margin-top: 10px;
    color: #cbd5e1;
    font-size: 14px;
    font-weight: 500;
    overflow-wrap: anywhere;
}

.empty {
    grid-column: 1 / -1;
    text-align: center;
    color: #94a3b8;
    padding: 40px 20px;
    background: #111827;
    border-radius: 18px;
}

.loader {
    grid-column: 1 / -1;
    text-align: center;
    color: #cbd5e1;
    padding: 30px;
}

/* MODAL */

.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding:
        max(20px, env(safe-area-inset-top))
        max(20px, env(safe-area-inset-right))
        max(20px, env(safe-area-inset-bottom))
        max(20px, env(safe-area-inset-left));
}

.modal-content {
    background: #111827;
    padding: 24px;
    border-radius: 18px;
    width: 100%;
    max-width: 500px;
    max-height: 90vh;
    max-height: 90dvh;
    overflow-y: auto;
    overscroll-behavior: contain;
    border: 1px solid #374151;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
}

.modal-content h2 {
    margin-bottom: 20px;
}

.modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.modal-actions button {
    flex: 1;
}

.image-preview-box {
    background: #1f2937;
    border-radius: 12px;
    padding: 10px;
    margin: 15px 0;
    text-align: center;
}

.image-preview-box img {
    display: block;
    width: auto;
    max-width: 100%;
    max-height: 240px;
    margin: 0 auto;
    border-radius: 8px;
    object-fit: cover;
}

/* TABLET */

@media (max-width: 900px) {
    header {
        padding: 34px 18px;
    }

    .container {
        padding: 16px;
    }
}

/* MOBIL */

@media (max-width: 700px) {
    body {
        font-size: 16px;
    }

    .login-screen {
        align-items: center;
        padding: 14px;
    }

    .login-box {
        padding: 24px 18px;
        border-radius: 18px;
    }

    .login-box h1 {
        font-size: 28px;
    }

    header {
        padding: 24px 15px;
        padding-top: max(
            24px,
            calc(14px + env(safe-area-inset-top))
        );
    }

    header h1 {
        font-size: 28px;
    }

    header p {
        font-size: 14px;
    }

    .container {
        padding: 12px;
        padding-left: max(
            12px,
            env(safe-area-inset-left)
        );
        padding-right: max(
            12px,
            env(safe-area-inset-right)
        );
        padding-bottom: max(
            24px,
            env(safe-area-inset-bottom)
        );
    }

    .dashboard {
        grid-template-columns: repeat(
            2,
            minmax(0, 1fr)
        );
        gap: 10px;
    }

    .stat {
        padding: 15px 10px;
        border-radius: 15px;
    }

    .stat h2 {
        font-size: 26px;
    }

    .stat p {
        font-size: 14px;
        overflow-wrap: anywhere;
    }

    .form {
        padding: 18px 15px;
        border-radius: 16px;
    }

    .form h2 {
        font-size: 21px;
    }

    input,
    textarea {
        font-size: 16px;
        min-height: 48px;
    }

    textarea {
        min-height: 110px;
    }

    .form > button {
        width: 100%;
        min-height: 50px;
    }

    .grid {
        grid-template-columns: minmax(0, 1fr);
        gap: 16px;
    }

    .card {
        border-radius: 16px;
    }

    .card-image-wrapper {
        height: 200px;
    }

    .no-img {
        height: 150px;
    }

    .content {
        padding: 16px;
    }

    .task-title {
        font-size: 21px;
    }

    .progress-row {
        font-size: 14px;
    }

    .person {
        flex-direction: column;
        align-items: flex-start;
        padding: 12px;
    }

    .actions {
        flex-direction: column;
        width: 100%;
        gap: 10px;
    }

    .actions button {
        width: 100%;
        min-height: 48px;
    }

    button {
        min-height: 48px;
        font-size: 16px;
    }

    .top-actions {
        justify-content: stretch;
    }

    .top-actions button {
        width: 100%;
    }

    .modal-overlay {
        align-items: flex-end;
        padding: 0;
    }

    .modal-content {
        max-width: none;
        max-height: 94vh;
        max-height: 94dvh;
        padding: 20px 15px;
        padding-bottom: max(
            20px,
            env(safe-area-inset-bottom)
        );
        border-radius: 20px 20px 0 0;
        border-left: none;
        border-right: none;
        border-bottom: none;
    }

    .modal-content h2 {
        font-size: 22px;
    }

    .modal-actions {
        flex-direction: column;
    }

    .modal-actions button {
        width: 100%;
        flex: none;
    }

    .image-preview-box img {
        max-height: 200px;
    }

    .empty {
        padding: 32px 18px;
    }
}

/* SMÅ MOBILER */

@media (max-width: 380px) {
    .dashboard {
        grid-template-columns: 1fr;
    }

    header h1 {
        font-size: 25px;
    }

    .form h2,
    .modal-content h2 {
        font-size: 20px;
    }

    .card-image-wrapper {
        height: 175px;
    }
}

/* MINDRE ANIMATION VID SYSTEMINSTÄLLNING */

@media (prefers-reduced-motion: reduce) {
    html {
        scroll-behavior: auto;
    }

    *,
    *::before,
    *::after {
        transition: none !important;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen" class="login-screen">
    <div class="login-box">
        <h1>🔒 FIXDAY</h1>

        <p>Ange lösenord för att fortsätta</p>

        <label for="passwordInput" class="hidden">
            Lösenord
        </label>

        <input
            id="passwordInput"
            type="password"
            placeholder="Lösenord"
            autocomplete="current-password"
            enterkeyhint="go"
        >

        <button id="loginBtn" type="button">
            Öppna FIXDAY
        </button>

        <p
            id="loginError"
            role="alert"
            style="
                color:#fca5a5;
                margin-top:15px;
                margin-bottom:0;
                display:none;
            "
        >
            Fel lösenord
        </p>
    </div>
</div>

<!-- APP -->

<div id="app" class="hidden">
    <header>
        <h1>🔧 FIXDAY</h1>
        <p>Teamuppgifter, bilder och anmälningar</p>
    </header>

    <main class="container">

        <div class="top-actions">
            <button
                id="logoutBtn"
                type="button"
                class="secondary"
            >
                Logga ut
            </button>
        </div>

        <section
            class="dashboard"
            aria-label="Översikt"
        >
            <div class="stat">
                <h2 id="taskCount">0</h2>
                <p>Uppgifter</p>
            </div>

            <div class="stat">
                <h2 id="participantCount">0</h2>
                <p>Anmälningar</p>
            </div>
        </section>

        <section class="form">
            <h2>➕ Skapa ny uppgift</h2>

            <label for="taskName">
                Uppgiftens namn
            </label>

            <input
                id="taskName"
                type="text"
                placeholder="T.ex. städa förrådet, måla en vägg eller flytta bord"
                autocomplete="off"
            >

            <label for="taskDescription">
                Beskrivning
            </label>

            <textarea
                id="taskDescription"
                placeholder="Beskriv vad som ska göras"
            ></textarea>

            <label for="taskMax">
                Max antal personer
            </label>

            <input
                id="taskMax"
                type="number"
                value="1"
                min="1"
                inputmode="numeric"
            >

            <label for="taskImage">
                Bild till uppgiften
            </label>

            <input
                id="taskImage"
                type="file"
                accept="image/*"
            >

            <button
                id="createTaskBtn"
                type="button"
            >
                Skapa uppgift
            </button>

            <div
                id="createStatus"
                class="status-message"
                role="status"
                aria-live="polite"
            ></div>
        </section>

        <section
            id="taskList"
            class="grid"
            aria-live="polite"
        >
            <div class="loader">
                Laddar uppgifter...
            </div>
        </section>
    </main>
</div>

<!-- MODAL FÖR REDIGERING -->

<div
    id="editModal"
    class="modal-overlay hidden"
    role="dialog"
    aria-modal="true"
    aria-labelledby="editModalTitle"
>
    <div class="modal-content">
        <h2 id="editModalTitle">
            ✏️ Redigera uppgift
        </h2>

        <label for="editTaskName">
            Uppgiftens namn
        </label>

        <input
            id="editTaskName"
            type="text"
            autocomplete="off"
        >

        <label for="editTaskDescription">
            Beskrivning
        </label>

        <textarea id="editTaskDescription"></textarea>

        <label for="editTaskMax">
            Max antal personer
        </label>
