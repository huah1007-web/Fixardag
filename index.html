<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIXDAY Team Opgaver</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", Arial, sans-serif;
}

body {
    background: #0f172a;
    color: #ffffff;
    min-height: 100vh;
}

.hidden {
    display: none !important;
}

.login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0f172a, #1e3a8a);
    padding: 20px;
}

.login-box {
    background: #111827;
    padding: 30px;
    border-radius: 22px;
    width: 100%;
    max-width: 420px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
}

.login-box h1 { margin-bottom: 10px; }
.login-box p { color: #cbd5e1; margin-bottom: 20px; }
.login-box input { text-align: center; font-size: 18px; }

header {
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    padding: 45px 20px;
    text-align: center;
}

header h1 { font-size: 38px; margin-bottom: 8px; }
header p { color: #dbeafe; }

.container {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

.dashboard {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
    margin-bottom: 20px;
}

.stat {
    background: #111827;
    padding: 20px;
    border-radius: 18px;
    text-align: center;
    box-shadow: 0 8px 20px rgba(0,0,0,0.18);
}

.stat h2 { font-size: 34px; color: #60a5fa; }

.form {
    background: #111827;
    padding: 22px;
    border-radius: 18px;
    margin-bottom: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.18);
}

.form h2 { margin-bottom: 15px; }

label {
    display: block;
    margin: 10px 0 6px;
    color: #cbd5e1;
    font-size: 14px;
}

input, textarea {
    width: 100%;
    padding: 13px;
    background: #1f2937;
    color: #ffffff;
    border: 1px solid #334155;
    border-radius: 12px;
    outline: none;
}

textarea { min-height: 90px; resize: vertical; }
input:focus, textarea:focus { border-color: #60a5fa; }

button {
    background: #2563eb;
    color: #ffffff;
    border: none;
    padding: 12px 18px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 600;
    margin-top: 8px;
}

button:hover { background: #1d4ed8; }
button.secondary { background: #374151; }
button.secondary:hover { background: #4b5563; }
button.danger { background: #dc2626; }
button.danger:hover { background: #b91c1c; }
button.success { background: #16a34a; }
button.success:hover { background: #15803d; }
button:disabled { background: #64748b; cursor: not-allowed; }

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
    gap: 20px;
}

.card {
    background: #111827;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0,0,0,0.22);
    display: flex;
    flex-direction: column;
}

.card-img {
    width: 100%;
    height: 230px;
    object-fit: cover;
    background: #1f2937;
}

.no-img {
    height: 180px;
    background: linear-gradient(135deg, #1e293b, #334155);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #94a3b8;
    font-size: 48px;
}

.content { padding: 20px; flex: 1; }
.task-title { font-size: 22px; margin-bottom: 8px; }
.description { color: #cbd5e1; margin-bottom: 14px; white-space: pre-wrap; }
.progress-row { display: flex; justify-content: space-between; align-items: center; margin: 14px 0 8px; color: #e5e7eb; }
.progress { height: 10px; background: #1f2937; border-radius: 999px; overflow: hidden; margin-bottom: 15px; }
.progress-fill { height: 100%; background: #22c55e; width: 0%; }
.full .progress-fill { background: #ef4444; }
.people { margin-top: 10px; }
.person { background: #1f2937; padding: 10px; border-radius: 12px; margin-top: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.person-name { word-break: break-word; }
.badge { padding: 4px 8px; border-radius: 999px; font-size: 12px; white-space: nowrap; }
.badge.waiting { background: #92400e; color: #fde68a; }
.badge.done { background: #14532d; color: #bbf7d0; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.status-message { margin-top: 10px; color: #cbd5e1; font-size: 14px; font-weight: 500; }
.empty { text-align: center; color: #94a3b8; padding: 40px; background: #111827; border-radius: 18px; }
.loader { text-align: center; color: #cbd5e1; padding: 30px; }
.top-actions { display: flex; justify-content: flex-end; margin-bottom: 15px; }

/* MODAL DESIGN */
.modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
}

.modal-content {
    background: #111827;
    padding: 24px;
    border-radius: 18px;
    width: 100%;
    max-width: 500px;
    max-height: 90vh;
    overflow-y: auto;
    border: 1px solid #374151;
}

.modal-content h2 {
    margin-bottom: 20px;
}

.image-preview-box {
    background: #1f2937;
    border-radius: 12px;
    padding: 10px;
    margin: 15px 0;
    text-align: center;
}

.image-preview-box img {
    max-width: 100%;
    max-height: 200px;
    border-radius: 8px;
    object-fit: cover;
}

@media (max-width: 700px) {
    header { padding: 32px 16px; }
    header h1 { font-size: 30px; }
    .container { padding: 14px; }
    .grid { grid-template-columns: 1fr; }
    .card-img { height: 210px; }
    button { width: 100%; }
    .actions { flex-direction: column; }
    .modal-content { padding: 15px; }
}
</style>
</head>

<body>

<div id="loginScreen" class="login-screen">
    <div class="login-box">
        <h1>🔒 FIXDAY</h1>
        <p>Indtast adgangskode for at fortsætte</p>
        <input id="passwordInput" type="password" placeholder="Adgangskode">
        <button id="loginBtn">Åbn FIXDAY</button>
        <p id="loginError" style="color:#fca5a5;margin-top:15px;display:none;">Forkert adgangskode</p>
    </div>
</div>

<div id="app" class="hidden">
    <header>
        <h1>🔧 FIXDAY</h1>
        <p>Team opgaver, billeder og tilmelding</p>
    </header>

    <div class="container">
        <div class="top-actions">
            <button id="logoutBtn" class="secondary">Log ud</button>
        </div>

        <div class="dashboard">
            <div class="stat">
                <h2 id="taskCount">0</h2>
                <p>Opgaver</p>
            </div>
            <div class="stat">
                <h2 id="participantCount">0</h2>
                <p>Tilmeldinger</p>
            </div>
        </div>

        <div class="form">
            <h2>➕ Opret ny opgave</h2>

            <label>Opgavenavn</label>
            <input id="taskName" placeholder="Fx Ryd depot, mal væg, flyt borde">

            <label>Beskrivelse</label>
            <textarea id="taskDescription" placeholder="Skriv hvad der skal laves"></textarea>

            <label>Max antal personer</label>
            <input id="taskMax" type="number" value="1" min="1">

            <label>Billede til opgaven</label>
            <input id="taskImage" type="file" accept="image/*">

            <button id="createTaskBtn">Opret opgave</button>
            <div id="createStatus" class="status-message"></div>
        </div>

        <div id="taskList" class="grid">
            <div class="loader">Indlæser opgaver...</div>
        </div>
    </div>
</div>

<!-- REDIGER OPGAVE MODAL -->
<div id="editModal" class="modal-overlay hidden">
    <div class="modal-content">
        <h2>✏️ Rediger opgave</h2>
        
        <label>Opgavenavn</label>
        <input id="editTaskName" type="text">
        
        <label>Beskrivelse</label>
        <textarea id="editTaskDescription"></textarea>
        
        <label>Max antal personer</label>
        <input id="editTaskMax" type="number" min="1">
        
        <!-- Vises kun hvis der findes et billede i forvejen -->
        <div id="currentImageBox" class="image-preview-box" style="display: none;">
            <p style="margin-bottom: 8px; font-size: 14px; color: #cbd5e1;">Nuværende billede:</p>
            <img id="editTaskImagePreview" src="" alt="Nuværende">
            <button id="removeImageBtn" class="danger" style="margin-top: 10px;">🗑️ Slet nuværende billede</button>
        </div>

        <label style="margin-top: 15px;">Upload et nyt billede (erstatter det gamle)</label>
        <input id="editTaskImage" type="file" accept="image/*">

        <div id="editStatus" class="status-message"></div>

        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button id="saveEditBtn" class="success" style="flex: 1;">Gem ændringer</button>
            <button id="cancelEditBtn" class="secondary" style="flex: 1;">Annuller</button>
        </div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import { getFirestore, collection, addDoc, doc, updateDoc, deleteDoc, onSnapshot, serverTimestamp, runTransaction } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
// VIGTIGT: deleteObject er tilføjet her, så vi kan rydde op i slettede billeder!
import { getStorage, ref, uploadBytes, uploadString, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-storage.js";

const firebaseConfig = {
    apiKey: "AIzaSyDeKIZcW1Mvi4lYvaKRMOWdKk3ikFXwEAU",
    authDomain: "huah-198fc.firebaseapp.com",
    projectId: "huah-198fc",
    storageBucket: "huah-198fc.firebasestorage.app",
    messagingSenderId: "276648968284",
    appId: "1:276648968284:web:029616d17546aa7d662699",
    measurementId: "G-J8V7DB0DF7"
};

const PASSWORD = "A2026";
const appFirebase = initializeApp(firebaseConfig);
const db = getFirestore(appFirebase);
const storage = getStorage(appFirebase);

let allTasks = [];

const loginScreen = document.getElementById("loginScreen");
const app = document.getElementById("app");
const passwordInput = document.getElementById("passwordInput");
const loginBtn = document.getElementById("loginBtn");
const loginError = document.getElementById("loginError");
const logoutBtn = document.getElementById("logoutBtn");

const taskName = document.getElementById("taskName");
const taskDescription = document.getElementById("taskDescription");
const taskMax = document.getElementById("taskMax");
const taskImage = document.getElementById("taskImage");
const createTaskBtn = document.getElementById("createTaskBtn");
const createStatus = document.getElementById("createStatus");
const taskList = document.getElementById("taskList");

// Elementer til Modal
const editModal = document.getElementById("editModal");
const editTaskName = document.getElementById("editTaskName");
const editTaskDescription = document.getElementById("editTaskDescription");
const editTaskMax = document.getElementById("editTaskMax");
const editTaskImage = document.getElementById("editTaskImage");
const currentImageBox = document.getElementById("currentImageBox");
const editTaskImagePreview = document.getElementById("editTaskImagePreview");
const removeImageBtn = document.getElementById("removeImageBtn");
const saveEditBtn = document.getElementById("saveEditBtn");
const cancelEditBtn = document.getElementById("cancelEditBtn");
const editStatus = document.getElementById("editStatus");

let currentEditingTask = null;
let removeExistingImageFlag = false;

function checkLogin() {
    if (sessionStorage.getItem("fixday_access") === "ok") {
        loginScreen.classList.add("hidden");
        app.classList.remove("hidden");
        startApp();
    }
}

loginBtn.addEventListener("click", login);
passwordInput.addEventListener("keydown", function(event) { if (event.key === "Enter") login(); });
logoutBtn.addEventListener("click", function() { sessionStorage.removeItem("fixday_access"); location.reload(); });

function login() {
    if (passwordInput.value.trim() === PASSWORD) {
        sessionStorage.setItem("fixday_access", "ok");
        loginScreen.classList.add("hidden");
        app.classList.remove("hidden");
        startApp();
    } else {
        loginError.style.display = "block";
        passwordInput.value = "";
        passwordInput.focus();
    }
}

let appStarted = false;
function startApp() {
    if (appStarted) return;
    appStarted = true;
    createTaskBtn.addEventListener("click", createTask);

    onSnapshot(collection(db, "tasks"), 
        (snapshot) => {
            allTasks = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            allTasks.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
            renderTasks();
        },
        (error) => {
            console.error(error);
            taskList.innerHTML = `<div class="empty">Kunne ikke hente opgaver. Tjek rettigheder.</div>`;
        }
    );
}

// DEN SKUDSIKRE KOMPRIMERINGS-FUNKTION
function compressImage(file, maxWidth = 1000, quality = 0.7) {
    return new Promise((resolve, reject) => {
        const problemFormats = ['image/avif', 'image/heic', 'image/heif'];
        if (problemFormats.includes(file.type.toLowerCase())) {
            return reject(new Error("Drilsk filformat, springer komprimering over."));
        }

        const timeout = setTimeout(() => reject(new Error("Timeout")), 8000);
        const reader = new FileReader();
        
        reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
                clearTimeout(timeout);
                let width = img.width, height = img.height;
                if (width > maxWidth) {
                    height = Math.round((height * maxWidth) / width);
                    width = maxWidth;
                }
                const canvas = document.createElement('canvas');
                canvas.width = width; canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                resolve(canvas.toDataURL('image/jpeg', quality));
            };
            img.onerror = () => { clearTimeout(timeout); reject(new Error("Kan ikke tegne billede.")); };
            img.src = event.target.result;
        };
        reader.onerror = () => { clearTimeout(timeout); reject(new Error("Læsefejl.")); };
        reader.readAsDataURL(file);
    });
}

// OPRET OPGAVE
async function createTask() {
    const name = taskName.value.trim();
    const description = taskDescription.value.trim();
    const max = parseInt(taskMax.value) || 1;
    const file = taskImage.files[0];

    if (!name) { alert("Skriv et opgavenavn"); return; }
    if (max < 1) { alert("Max antal personer skal være mindst 1"); return; }

    createTaskBtn.disabled = true;
    createStatus.style.color = "#cbd5e1";

    try {
        let imageUrl = "";
        let imagePath = "";

        if (file) {
            const ext = file.name.split('.').pop() || "jpg";
            imagePath = `task-images/task_${Date.now()}.${ext}`;
            const imageRef = ref(storage, imagePath);

            createStatus.textContent = "Behandler billede...";

            try {
                const compressedBase64 = await compressImage(file, 1000, 0.75);
                createStatus.textContent = "Uploader komprimeret billede (hurtigt)...";
                await uploadString(imageRef, compressedBase64, 'data_url');
            } catch (err) {
                createStatus.textContent = "Uploader original fil (tager lidt længere)...";
                await uploadBytes(imageRef, file);
            }

            imageUrl = await getDownloadURL(imageRef);
        }

        createStatus.textContent = "Gemmer opgave...";

        await addDoc(collection(db, "tasks"), {
            name: name,
            description: description,
            max: max,
            imageUrl: imageUrl,
            imagePath: imagePath,
            people: [],
            createdAt: serverTimestamp()
        });

        taskName.value = ""; taskDescription.value = ""; taskMax.value = "1"; taskImage.value = "";
        createStatus.style.color = "#4ade80"; // Grøn
        createStatus.textContent = "Opgaven er oprettet ✅";
        setTimeout(() => createStatus.textContent = "", 3000);

    } catch (error) {
        console.error("Fejl:", error);
        createStatus.style.color = "#fca5a5"; // Rød
        createStatus.textContent = "Fejl ved oprettelse! Prøv igen.";
    }

    createTaskBtn.disabled = false;
}

function renderTasks() {
    let totalParticipants = 0;
    allTasks.forEach(task => totalParticipants += Array.isArray(task.people) ? task.people.length : 0);
    document.getElementById("taskCount").textContent = allTasks.length;
    document.getElementById("participantCount").textContent = totalParticipants;

    if (allTasks.length === 0) {
        taskList.innerHTML = `<div class="empty">Ingen opgaver endnu.<br>Opret den første opgave ovenfor.</div>`;
        return;
    }

    taskList.innerHTML = allTasks.map(task => {
        const people = Array.isArray(task.people) ? task.people : [];
        const max = task.max || 1;
        const percent = Math.min(100, Math.round((people.length / max) * 100));
        const isFull = people.length >= max;
        const imageHtml = task.imageUrl ? `<img src="${escapeHtml(task.imageUrl)}" class="card-img" alt="Opgavebillede">` : `<div class="no-img">📷</div>`;

        const peopleHtml = people.length ? people.map((person, index) => {
            const done = person.done === true;
            return `
                <div class="person">
                    <span class="person-name">${done ? "✅" : "⏳"} ${escapeHtml(person.name)}</span>
                    <span><span class="badge ${done ? "done" : "waiting"}">${done ? "Udført" : "I gang"}</span></span>
                </div>
                <div class="actions">
                    ${!done ? `<button data-action="done" data-task-id="${task.id}" data-person-index="${index}" class="success">Markér udført</button>` : ""}
                    <button data-action="remove-person" data-task-id="${task.id}" data-person-index="${index}" class="danger">Fjern person</button>
                </div>
            `;
        }).join("") : `<p style="color:#94a3b8;margin-top:10px;">Ingen tilmeldte endnu</p>`;

        return `
            <div class="card ${isFull ? "full" : ""}">
                ${imageHtml}
                <div class="content">
                    <h3 class="task-title">${escapeHtml(task.name)}</h3>
                    <p class="description">${escapeHtml(task.description || "")}</p>
                    <div class="progress-row"><span>Deltagere</span><strong>${people.length}/${max}</strong></div>
                    <div class="progress"><div class="progress-fill" style="width:${percent}%"></div></div>
                    <div class="people">${peopleHtml}</div>
                    <div class="actions">
                        <button data-action="join" data-task-id="${task.id}" class="success" ${isFull ? "disabled" : ""}>${isFull ? "Opgaven er fuld" : "Jeg kommer"}</button>
                        <button data-action="edit" data-task-id="${task.id}" class="secondary">Rediger</button>
                        <button data-action="delete" data-task-id="${task.id}" class="danger">Slet</button>
                    </div>
                </div>
            </div>
        `;
    }).join("");
}

taskList.addEventListener("click", async function(event) {
    const button = event.target.closest("button");
    if (!button) return;
    const { action, taskId, personIndex } = button.dataset;
    if (!action || !taskId) return;

    if (action === "join") await joinTask(taskId);
    if (action === "edit") openEditModal(taskId); // Åbner nu den nye modal
    if (action === "delete") await deleteTask(taskId);
    if (action === "done") await completePerson(taskId, parseInt(personIndex));
    if (action === "remove-person") await removePerson(taskId, parseInt(personIndex));
});

// --- DEN NYE REDIGERINGS LOGIK ---
function openEditModal(taskId) {
    currentEditingTask = allTasks.find(item => item.id === taskId);
    if (!currentEditingTask) return;

    // Udfyld formular med eksisterende data
    editTaskName.value = currentEditingTask.name || "";
    editTaskDescription.value = currentEditingTask.description || "";
    editTaskMax.value = currentEditingTask.max || 1;
    editTaskImage.value = ""; // Nulstil fil-input
    editStatus.textContent = "";
    removeExistingImageFlag = false;

    // Håndter billede preview
    if (currentEditingTask.imageUrl) {
        editTaskImagePreview.src = currentEditingTask.imageUrl;
        currentImageBox.style.display = "block";
    } else {
        currentImageBox.style.display = "none";
    }

    editModal.classList.remove("hidden");
}

cancelEditBtn.addEventListener("click", () => {
    editModal.classList.add("hidden");
    currentEditingTask = null;
});

// Når man trykker "Slet nuværende billede" i modalen
removeImageBtn.addEventListener("click", () => {
    removeExistingImageFlag = true;
    currentImageBox.style.display = "none";
});

// Gem ændringer i modalen
saveEditBtn.addEventListener("click", async () => {
    if (!currentEditingTask) return;

    const newName = editTaskName.value.trim();
    const newDesc = editTaskDescription.value.trim();
    const newMax = parseInt(editTaskMax.value) || 1;
    const file = editTaskImage.files[0];

    if (!newName) { alert("Opgavenavn kan ikke være tomt"); return; }
    if (newMax < (currentEditingTask.people?.length || 0)) { 
        alert("Max antal kan ikke være lavere end antallet af tilmeldte."); 
        return; 
    }

    saveEditBtn.disabled = true;
    editStatus.style.color = "#cbd5e1";
    editStatus.textContent = "Gemmer ændringer...";

    try {
        let updateData = {
            name: newName,
            description: newDesc,
            max: newMax
        };

        // 1. Hvis et helt NYT billede er valgt
        if (file) {
            editStatus.textContent = "Uploader nyt billede...";
            const ext = file.name.split('.').pop() || "jpg";
            const newImagePath = `task-images/task_${Date.now()}.${ext}`;
            const newImageRef = ref(storage, newImagePath);
            
            try {
                const compressedBase64 = await compressImage(file, 1000, 0.75);
                await uploadString(newImageRef, compressedBase64, 'data_url');
            } catch (err) {
                await uploadBytes(newImageRef, file);
            }
            
            updateData.imageUrl = await getDownloadURL(newImageRef);
            updateData.imagePath = newImagePath;

            // Slet det gamle billede fra databasen for at spare plads
            if (currentEditingTask.imagePath) {
                deleteObject(ref(storage, currentEditingTask.imagePath)).catch(e => console.warn(e));
            }
        } 
        // 2. Hvis brugeren har valgt at slette det gamle uden at uploade et nyt
        else if (removeExistingImageFlag) {
            if (currentEditingTask.imagePath) {
                deleteObject(ref(storage, currentEditingTask.imagePath)).catch(e => console.warn(e));
            }
            updateData.imageUrl = "";
            updateData.imagePath = "";
        }

        // Opdater Firestore
        await updateDoc(doc(db, "tasks", currentEditingTask.id), updateData);
        
        editStatus.style.color = "#4ade80";
        editStatus.textContent = "Ændringer gemt ✅";
        
        setTimeout(() => {
            editModal.classList.add("hidden");
            saveEditBtn.disabled = false;
        }, 1000);

    } catch (error) {
        console.error("Fejl under redigering:", error);
        editStatus.style.color = "#fca5a5";
        editStatus.textContent = "Fejl ved gemning!";
        saveEditBtn.disabled = false;
    }
});

// SLET OPGAVE - Opdateret så den også sletter billedet fra Storage
async function deleteTask(taskId) {
    const task = allTasks.find(item => item.id === taskId);
    if (!task || !confirm("Vil du slette opgaven: " + task.name + "?")) return;
    try { 
        // Ryd op i Storage hvis der er et billede
        if (task.imagePath) {
            deleteObject(ref(storage, task.imagePath)).catch(e => console.warn("Billede slettet, eller fandtes ikke:", e));
        }
        await deleteDoc(doc(db, "tasks", taskId)); 
    } 
    catch (e) { console.error(e); }
}

async function joinTask(taskId) {
    const personName = prompt("Skriv dit navn");
    if (!personName || !personName.trim()) return;
    try {
        await runTransaction(db, async (transaction) => {
            const taskRef = doc(db, "tasks", taskId);
            const taskSnap = await transaction.get(taskRef);
            if (!taskSnap.exists()) throw new Error("Opgaven findes ikke længere");
            const task = taskSnap.data();
            const people = Array.isArray(task.people) ? task.people : [];
            if (people.some(p => p.name.toLowerCase() === personName.trim().toLowerCase())) throw new Error("Du er allerede tilmeldt");
            if (people.length >= (task.max || 1)) throw new Error("Opgaven er fuld");
            people.push({ name: personName.trim(), done: false });
            transaction.update(taskRef, { people });
        });
    } catch (error) { alert(error.message || "Fejl"); }
}

async function completePerson(taskId, personIndex) {
    const task = allTasks.find(item => item.id === taskId);
    if (!task || !task.people[personIndex]) return;
    const people = [...task.people];
    people[personIndex].done = true;
    try { await updateDoc(doc(db, "tasks", taskId), { people }); }
    catch (e) { console.error(e); }
}

async function removePerson(taskId, personIndex) {
    const task = allTasks.find(item => item.id === taskId);
    if (!task || !task.people[personIndex] || !confirm("Fjern " + task.people[personIndex].name + "?")) return;
    const people = [...task.people];
    people.splice(personIndex, 1);
    try { await updateDoc(doc(db, "tasks", taskId), { people }); }
    catch (e) { console.error(e); }
}

function escapeHtml(value) {
    return String(value).replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;");
}
