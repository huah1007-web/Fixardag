<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIXDAY Team Tasks</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", Arial, sans-serif;
}

body {
    background: #0f172a;
    color: #ffffff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.upload-card {
    background: #111827;
    border: 1px solid #1f2937;
    border-radius: 12px;
    padding: 24px;
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.upload-btn {
    display: block;
    background: #2563eb;
    color: #ffffff;
    text-align: center;
    padding: 12px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    transition: background 0.2s;
}

.upload-btn:hover {
    background: #1d4ed8;
}

.file-input {
    display: none;
}

.preview-container {
    width: 100%;
    min-height: 150px;
    border: 2px dashed #374151;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #0b0f19;
}

.preview-img {
    max-width: 100%;
    max-height: 250px;
    object-fit: contain;
}

.status-text {
    font-size: 14px;
    color: #9ca3af;
    text-align: center;
    font-weight: 500;
}
</style>
</head>
<body>

<div class="upload-card">
    <label class="upload-btn" for="imageInput">Vælg eller tag billede</label>
    <input type="file" id="imageInput" class="file-input" accept="image/*">
    
    <div class="preview-container">
        <span id="placeholderText" class="status-text">Intet billede valgt endnu</span>
        <img id="imagePreview" class="preview-img" style="display: none;" alt="Preview">
    </div>

    <div id="fileInfo" class="status-text">Klar til upload</div>
</div>

<!-- Vigtigt: script skal være type="module" for at bruge Firebase v9/v10 import syntax -->
<script type="module">
    // 1. Importer Firebase-moduler direkte fra CDN
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getStorage, ref, uploadString, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    // 2. INDSÆT DIN FIREBASE CONFIG HER
    const firebaseConfig = {
        apiKey: "DIN_API_KEY",
        authDomain: "DIT_PROJEKT.firebaseapp.com",
        projectId: "DIT_PROJEKT",
        storageBucket: "DIT_PROJEKT.appspot.com",
        messagingSenderId: "SENDER_ID",
        appId: "APP_ID"
    };

    // 3. Initialiser Firebase
    const app = initializeApp(firebaseConfig);
    const storage = getStorage(app);
    const db = getFirestore(app);

    // 4. HTML Elementer
    const imageInput = document.getElementById('imageInput');
    const imagePreview = document.getElementById('imagePreview');
    const placeholderText = document.getElementById('placeholderText');
    const fileInfo = document.getElementById('fileInfo');

    // 5. Komprimeringsfunktion via Canvas
    function compressImage(file, maxWidth = 1200, quality = 0.7) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);

            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;

                img.onload = () => {
                    let width = img.width;
                    let height = img.height;

                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }

                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const compressedDataUrl = canvas.toDataURL('image/jpeg', quality);
                    resolve(compressedDataUrl);
                };
                img.onerror = (error) => reject(error);
            };
            reader.onerror = (error) => reject(error);
        });
    }

    // 6. Hovedfunktion der kører, når brugeren vælger et billede
    imageInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        // Nulstil stil og vis status
        fileInfo.style.color = "#9ca3af";
        fileInfo.textContent = "Behandler billede lokalt...";

        try {
            // A. Komprimer billedet lynhurtigt
            const compressedBase64 = await compressImage(file, 1200, 0.75);

            // B. Vis preview MED DET SAMME (før upload starter)
            imagePreview.src = compressedBase64;
            imagePreview.style.display = 'block';
            placeholderText.style.display = 'none';
            
            fileInfo.textContent = "Uploader til Firebase...";

            // C. Skab fil-sti og upload til Storage
            const fileName = `task_images/task_${Date.now()}.jpg`;
            const storageRef = ref(storage, fileName);
            await uploadString(storageRef, compressedBase64, 'data_url');

            // D. Hent det offentlige download-link
            const downloadURL = await getDownloadURL(storageRef);
            fileInfo.textContent = "Gemmer i database...";

            // E. Gem URL og opgavedata i Firestore (i samlingen 'tasks')
            await addDoc(collection(db, "tasks"), {
                imageUrl: downloadURL,
                status: "pending",
                uploadedAt: serverTimestamp(),
                teamMember: "FixDay Bruger" // Her kan du senere indsætte indlogget brugernavn
            });

            // F. Succes!
            fileInfo.textContent = "Billede uploadet med succes! ✅";
            fileInfo.style.color = "#4ade80"; // Grøn farve

        } catch (err) {
            console.error("Upload fejl:", err);
            fileInfo.textContent = "Der opstod en fejl ved upload ❌";
            fileInfo.style.color = "#f87171"; // Rød farve
        }
    });
</script>

</body>
</html>
