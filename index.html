<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIXDAY Team Tasks</title>

<style>
/* --- GENERELT DESIGN --- */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", Arial, sans-serif;
}

body {
    background: #0f172a;
    color: #ffffff;
    min-height: 100vh;
}

.hidden {
    display: none !important;
}

/* --- LOGIN SKÆRM --- */
.login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0f172a, #1e3a8a);
    padding: 20px;
}

.login-box {
    background: #111827;
    padding: 40px 30px;
    border-radius: 12px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    text-align: center;
}

.login-box h1 {
    color: #60a5fa;
    margin-bottom: 24px;
    font-size: 24px;
}

/* --- APP SKÆRM --- */
.app-screen {
    min-height: 100vh;
    padding: 20px;
    max-width: 500px;
    margin: 0 auto;
}

.app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid #1f2937;
}

.task-card {
    background: #111827;
    border: 1px solid #1f2937;
    border-radius: 12px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
}

/* --- FÆLLES ELEMENTER (Knapper & Input) --- */
.input-field {
    width: 100%;
    padding: 12px;
    margin-bottom: 16px;
    border-radius: 8px;
    border: 1px solid #374151;
    background: #1f2937;
    color: white;
    font-size: 16px;
}

.btn-primary {
    width: 100%;
    padding: 14px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    font-size: 16px;
    transition: background 0.2s;
}

.btn-primary:hover {
    background: #1d4ed8;
}

.btn-secondary {
    background: transparent;
    color: #ef4444;
    border: none;
    cursor: pointer;
    font-weight: bold;
}

/* --- UPLOAD DESIGN --- */
.upload-btn {
    display: block;
    background: #374151;
    color: #ffffff;
    text-align: center;
    padding: 12px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    transition: background 0.2s;
}
.upload-btn:hover { background: #4b5563; }
.file-input { display: none; }
.preview-container {
    width: 100%;
    min-height: 150px;
    border: 2px dashed #374151;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #0b0f19;
}
.preview-img { max-width: 100%; max-height: 250px; object-fit: contain; }
.status-text { font-size: 14px; color: #9ca3af; text-align: center; font-weight: 500; }
</style>
</head>
<body>

<!-- 1. LOGIN SKÆRMEN -->
<div id="loginScreen" class="login-screen">
    <div class="login-box">
        <h1>FIXDAY Team</h1>
        <input type="text" class="input-field" placeholder="Brugernavn">
        <input type="password" class="input-field" placeholder="Adgangskode">
        <button id="loginBtn" class="btn-primary">Log ind</button>
    </div>
</div>

<!-- 2. APP SKÆRMEN (Skjult som standard) -->
<div id="appScreen" class="app-screen hidden">
    <div class="app-header">
        <h2>Opret Opgave</h2>
        <button id="logoutBtn" class="btn-secondary">Log ud</button>
    </div>

    <div class="task-card">
        <!-- Opgave beskrivelse -->
        <textarea id="taskDesc" class="input-field" rows="3" placeholder="Beskriv opgaven (valgfrit)..." style="margin-bottom: 0;"></textarea>
        
        <!-- Billede upload knap -->
        <label class="upload-btn" for="imageInput">📸 Vælg eller tag billede</label>
        <input type="file" id="imageInput" class="file-input" accept="image/*">
        
        <!-- Billede preview -->
        <div class="preview-container">
            <span id="placeholderText" class="status-text">Intet billede valgt endnu</span>
            <img id="imagePreview" class="preview-img" style="display: none;" alt="Preview">
        </div>

        <div id="fileInfo" class="status-text">Udfyld data og tryk opret</div>
        
        <!-- Endelig opret knap -->
        <button id="submitTaskBtn" class="btn-primary">Opret Opgave</button>
    </div>
</div>

<!-- 3. JAVASCRIPT LOGIKKEN -->
<script type="module">
    // --- FIREBASE IMPORTS ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getStorage, ref, uploadString, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    // --- INDSÆT DIN FIREBASE CONFIG HER ---
    const firebaseConfig = {
        apiKey: "DIN_API_KEY",
        authDomain: "DIT_PROJEKT.firebaseapp.com",
        projectId: "DIT_PROJEKT",
        storageBucket: "DIT_PROJEKT.appspot.com",
        messagingSenderId: "SENDER_ID",
        appId: "APP_ID"
    };

    // Initialiser Firebase (Fjern // for at aktivere)
    // const app = initializeApp(firebaseConfig);
    // const storage = getStorage(app);
    // const db = getFirestore(app);

    // --- DOM ELEMENTER ---
    const loginScreen = document.getElementById('loginScreen');
    const appScreen = document.getElementById('appScreen');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    
    const imageInput = document.getElementById('imageInput');
    const imagePreview = document.getElementById('imagePreview');
    const placeholderText = document.getElementById('placeholderText');
    const fileInfo = document.getElementById('fileInfo');
    const submitTaskBtn = document.getElementById('submitTaskBtn');
    const taskDesc = document.getElementById('taskDesc');

    let currentBase64Image = null;

    // --- SKIFT MELLEM LOGIN OG APP ---
    loginBtn.addEventListener('click', () => {
        loginScreen.classList.add('hidden');
        appScreen.classList.remove('hidden');
    });

    logoutBtn.addEventListener('click', () => {
        appScreen.classList.add('hidden');
        loginScreen.classList.remove('hidden');
    });

    // --- BILLEDE KOMPRIMERING VIA CANVAS ---
    function compressImage(file, maxWidth = 1200, quality = 0.7) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    let width = img.width, height = img.height;
                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.onerror = (error) => reject(error);
            };
            reader.onerror = (error) => reject(error);
        });
    }

    // --- NÅR BRUGEREN VÆLGER ET BILLEDE ---
    imageInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        fileInfo.style.color = "#9ca3af";
        fileInfo.textContent = "Komprimerer billede lokalt...";

        try {
            // Komprimer billede og gem det i variablen
            currentBase64Image = await compressImage(file, 1200, 0.75);
            
            // Vis preview til brugeren
            imagePreview.src = currentBase64Image;
            imagePreview.style.display = 'block';
            placeholderText.style.display = 'none';
            
            fileInfo.textContent = "Billede klar. Tryk 'Opret Opgave' for at uploade.";
            fileInfo.style.color = "#60a5fa"; // Blå farve
        } catch (err) {
            console.error(err);
            fileInfo.textContent = "Fejl ved behandling af billede.";
            fileInfo.style.color = "#f87171";
        }
    });

    // --- NÅR BRUGEREN TRYKKE PÅ OPRET OPGAVE ---
    submitTaskBtn.addEventListener('click', async () => {
        if (!currentBase64Image) {
            alert("Vælg venligst et billede først!");
            return;
        }

        submitTaskBtn.disabled = true;
        submitTaskBtn.textContent = "Uploader...";
        fileInfo.textContent = "Sender til databasen...";

        try {
            // HUSK: Dette virker kun, når Firebase er slået til (linje 155-157).
            // Her uploader vi billedet til Storage
            /*
            const fileName = `task_images/task_${Date.now()}.jpg`;
            const storageRef = ref(storage, fileName);
            await uploadString(storageRef, currentBase64Image, 'data_url');
            const downloadURL = await getDownloadURL(storageRef);

            // Her gemmer vi selve opgaven i Firestore
            await addDoc(collection(db, "tasks"), {
                description: taskDesc.value,
                imageUrl: downloadURL,
                status: "pending",
                uploadedAt: serverTimestamp(),
            });
            */

            // Simulerer et upload for nu, da Firebase er udkommenteret i koden:
            await new Promise(resolve => setTimeout(resolve, 1500)); 

            // Nulstil formen efter succes
            fileInfo.textContent = "Opgave oprettet med succes! ✅";
            fileInfo.style.color = "#4ade80"; // Grøn
            submitTaskBtn.textContent = "Opret Opgave";
            submitTaskBtn.disabled = false;
            taskDesc.value = "";
            currentBase64Image = null;
            imagePreview.style.display = 'none';
            placeholderText.style.display = 'block';
            
        } catch (error) {
            console.error("Upload fejl:", error);
            fileInfo.textContent = "Der skete en fejl under upload ❌";
            fileInfo.style.color = "#f87171";
            submitTaskBtn.textContent = "Prøv igen";
            submitTaskBtn.disabled = false;
        }
    });
</script>

</body>
</html>
