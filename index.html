<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FixDay</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:#0f172a;
color:white;
}

header{
background:linear-gradient(135deg,#2563eb,#1d4ed8);
padding:50px;
text-align:center;
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.dashboard{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
margin-bottom:25px;
}

.stat{
background:#111827;

}

.form{
background:#111827;

border-radius:16px;
margin-bottom:20px;
}

input,textarea{
width:100%;
padding:12px;
margin-bottom:10px;
background:#1f2937;
color:white;
border:none;
border-radius:10px;
}

button{
background:#3b82f6;
color:white;
border:none;
padding:12px 18px;
border-radius:10px;
cursor:pointer;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(350px,1fr));
gap:20px;
}

.card{
background:#111827;
border-radius:20px;
overflow:hidden;
}

.card img{
width:100%;
height:240px;
object-fit:cover;
}

.content{
padding:20px;
}

.people{
margin-top:10px;
}

.person{
background:#1f2937;
padding:10px;
border-radius:10px;
margin-top:8px;
display:flex;
justify-content:space-between;
}

.green{
color:#22c55e;
font-weight:bold;
}

@media(max-width:768px){
header{
padding:30px;
}
}
</style>
</head>
